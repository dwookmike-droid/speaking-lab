          phrases: [When I compare, the biggest difference is, 'In my opinion, there are a few reasons for this', They've just adapted to]
        - text: >-
            Holidays in Korea have gone through a big transformation over the last twenty years or so. When I was a child,
            I remember everything being about obligation. You had to go to your hometown, you had to bow to every
            relative, and the women in the family had to cook nonstop. People complained, but nobody really questioned it.
            Nowadays, the atmosphere is completely different. Many families divide the cooking evenly or simply buy
            prepared food, and it's common to visit the in-laws on one holiday and your own parents on the next. There are
            even people who spend the entire holiday on a trip with friends. I think this change comes from two things.
            First, younger Koreans value equality and personal time much more. Second, the population has moved to big
            cities, so hometown visits feel less natural. Personally, I think the new style is healthier for families.
          phrases: [have gone through a big transformation, 'Nowadays, the atmosphere is completely different', I think this change comes from two things, Personally]
      al:
        - text: >-
            Looking back, I'd say holidays in Korea have changed more in the last twenty years than in the previous
            hundred. When I was a child, a holiday like Chuseok followed a very fixed script. Everyone traveled to the
            eldest son's house, no matter how far it was, and the day revolved around the ancestral ceremony, which
            required an enormous amount of food. The work was rarely shared equally, and honestly, a lot of people,
            especially women, dreaded the holidays. Today, the picture is much more varied. Some families still keep every
            tradition, but many have simplified the ceremony or dropped it entirely. It's become common to order the
            holiday food, to meet at a restaurant instead of someone's home, or to use the long break for a vacation. I
            think the changes come from a mix of factors. Families are smaller and more scattered, people are more aware
            of gender equality, and the younger generation doesn't feel that tradition alone is a good enough reason to do
            something. Personally, I see it as a healthy evolution, as long as people still make time for their families.
          phrases: ['Looking back, I''d say', followed a very fixed script, 'Today, the picture is much more varied', I see it as a healthy evolution]
        - text: >-
            The way Koreans spend their holidays has shifted dramatically since I was a kid, and you can see it almost
            everywhere. Back then, the main image of Chuseok on the news was endless traffic jams and train stations
            packed with people carrying gift boxes. The whole country seemed to be heading home at once, and families
            followed the same routine: cook, perform the ceremony, eat, and repeat. Nowadays, the news is just as likely
            to show crowded airports, because a huge number of people treat the holiday as a chance to travel. Even
            families that stay home have adjusted things. My aunt, for example, used to insist on making everything from
            scratch, but a few years ago she announced that we'd be ordering half of the dishes, and nobody complained. In
            my view, these changes reflect larger trends in society. People work longer hours, they live farther from
            their parents, and they're more willing to question customs that cause stress. I don't think we've lost
            anything essential, though. If anything, holidays feel more relaxed and genuine now.
          phrases: [has shifted dramatically, Back then, 'In my view, these changes reflect', If anything]
