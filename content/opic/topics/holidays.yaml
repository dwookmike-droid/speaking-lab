          phrases: [holidays today feel more flexible, there was one right way, Another change is that, 'Honestly, I like the new style better']
      ih:
        - text: >-
            When I compare holidays now with the holidays I remember from my childhood, the biggest difference is how much
            smaller and more flexible they've become. When I was little, Chuseok meant a long trip to the countryside, a
            house packed with relatives, and a mountain of food that took two full days to prepare. The rules were strict,
            and nobody would ever think of skipping the memorial ceremony. These days, my extended family rarely gathers
            all at once. Some relatives come for lunch and leave early, and a few of my cousins spend the holiday
            traveling abroad instead. Even the food has changed, since many families now order holiday dishes online. In
            my opinion, there are a few reasons for this. Families are smaller, more people live alone, and younger
            generations question traditions that put too much work on certain family members. I don't think the holidays
