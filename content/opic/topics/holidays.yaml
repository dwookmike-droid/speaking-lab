  - id: holidays-issue
    type: issue
    level: [4, 5, 6]
    question: >-
      Some people say holiday travel and family gatherings cause a lot of stress, and many people now skip them.
      What do you think about this issue? Why do people feel this way, and what could be done about it?
    model:
      il:
        - text: >-
            I think holidays are stressful. People drive a long time. They cook a lot. Some people fight. So some people
            stay home and rest. I think families should cook less and talk more.
          phrases: [I think holidays are stressful, So some people stay home]
        - text: >-
            Many people do not like holidays now. They are tired. The traffic is bad. Relatives ask many questions. I
            think we can meet for a short time. That is better.
          phrases: [Many people do not like, I think we can]
      im1:
        - text: >-
            I think many people feel stress during holidays. First, the traffic is terrible, so traveling takes a long
            time. Second, there is a lot of cooking, and usually only some family members do it. Also, relatives often ask
            personal questions about jobs or marriage. Because of this, some people stay home. I think families should
            share the work and not ask too many personal questions.
          phrases: [I think many people feel stress, Because of this, I think families should]
        - text: >-
            These days, many young people skip family gatherings, and I understand why. Holidays are supposed to be
            relaxing, but they are often very tiring. People spend many hours on the road. They also feel pressure from
            older relatives. I think the solution is to make holidays simple. For example, families can meet for one meal
            and order food. Then everyone can enjoy the time together.
          phrases: [and I understand why, are supposed to be, I think the solution is]
      im2:
        - text: >-
            I think holiday stress is a real problem in Korea. There are a few reasons. First, traveling to your hometown
            can take many hours because everyone goes at the same time. Second, preparing traditional food is a lot of
            work, and in many families, the women still do most of it. Third, some relatives ask personal questions, like
            when you will get married or how much money you make. Because of all this, more people are skipping family
            gatherings. In my opinion, families should talk openly and decide together how to celebrate. For example, they
            can share the cooking or meet in a restaurant.
          phrases: [is a real problem in Korea, There are a few reasons, Because of all this, In my opinion]
        - text: >-
            To be honest, I can understand why many people find holidays stressful. Holidays should be a time to rest, but
            for a lot of people, they feel like extra work. You have to drive for hours, cook all day, and answer
            uncomfortable questions from relatives. On top of that, some people feel guilty if they don't follow every
            tradition. I think the answer is not to stop meeting family, but to change the way we celebrate. My family
            started meeting for just one day and buying some of the food. Since then, everyone has been much happier.
          phrases: ['To be honest, I can understand why', On top of that, I think the answer is not to, Since then]
      im3:
        - text: >-
            Holiday stress has become a pretty common topic in Korea, and I think it's a serious issue. Every year, you
            see news stories about family arguments and even divorces after long holidays. I think there are several
            reasons. First, the traditional way of celebrating requires a huge amount of work, and it's often not shared
            fairly. Second, holiday travel is exhausting because the whole country moves at once. Third, many young people
            feel pressure from relatives who compare them with others. Because of this, a lot of people now choose to stay
            home or travel alone. To solve this, I think families need to update their traditions. For example, they could
            simplify the ceremony, share the cooking, and avoid sensitive questions. Holidays should be enjoyable for
            everyone.
          phrases: [has become a pretty common topic, I think there are several reasons, To solve this, should be enjoyable for everyone]
        - text: >-
            I personally think it's natural that more people are skipping holiday gatherings. Many traditions were created
            when most people lived in the same village and families were much bigger. Now, people live far away from their
            hometowns and work long hours, so a long trip during a short holiday can be really tiring. Also, younger
            people don't like being asked about their grades, jobs, or marriage plans in front of everyone. However, I
            don't think skipping family completely is the best answer. Instead, families could try new ways to get
            together, like meeting in the middle, or choosing a different weekend when traffic is lighter. If everyone is
            a little flexible, holidays can become something people look forward to again.
          phrases: [I personally think it's natural that, 'However, I don''t think', 'Instead, families could try', If everyone is a little flexible]
      ih:
        - text: >-
            Holiday stress is definitely a real issue in Korea, and I think it has become more visible in recent years. On
            paper, holidays are about rest and family, but for many people, they mean long hours in traffic, endless
            cooking, and awkward conversations. A big part of the problem is that the traditional way of celebrating was
            designed for large families living close together, and it doesn't fit modern life very well. Another issue is
            fairness. In many households, the cooking and cleaning still fall mostly on women, which naturally creates
            tension. And for younger people, being questioned about their jobs or relationships in front of the whole
            family can be really uncomfortable. That's why more and more people are skipping gatherings or traveling
            instead. In my opinion, the solution isn't to abandon family holidays but to redesign them. Families could
            simplify the ceremonies, divide the work fairly, and agree to avoid sensitive topics. Small changes like that
            could make a big difference.
          phrases: [is definitely a real issue, A big part of the problem is that, That's why more and more people, 'In my opinion, the solution isn''t to']
        - text: >-
            I think it's important to talk about this issue honestly, because holiday stress affects a lot of families.
            From what I've seen, there are three main causes. The first is physical exhaustion. Traveling across the
            country on the same day as millions of other people is tiring before the holiday even starts. The second is
            the workload. Traditional holiday meals involve dozens of dishes, and the person who does most of the work
            often ends up resenting the whole event. The third is emotional pressure, especially for young adults who get
            compared with their cousins. Personally, I don't blame people for skipping gatherings, but I also think
            something valuable gets lost when they do. A better approach would be for families to openly discuss what they
            actually want from the holiday. In my family, we did that a few years ago, and we decided to cut the number of
            dishes in half and take turns hosting. Since then, holidays have become something we actually look forward to.
          phrases: ['From what I''ve seen, there are three main causes', 'Personally, I don''t blame people for', A better approach would be, Since then]
      al:
        - text: >-
            Holiday stress is a topic that comes up every single year in Korea, and I think it reflects a deeper gap
            between tradition and modern life. The customs we follow on Seollal and Chuseok developed when most people
            lived in farming villages with large extended families nearby. In that context, gathering at the eldest son's
            house and preparing a big ceremony made sense. Today, though, families are scattered across the country, most
            people work long hours, and the idea that certain family members should do all the cooking is increasingly
            seen as unfair. When you put all that together, it's no surprise that many people associate holidays with
            exhaustion rather than rest. Personally, I understand why some choose to skip gatherings altogether, but I
            think that's more of a symptom than a solution. What families really need is an honest conversation about
            which traditions still matter to them and which ones are just habits. For instance, some families have kept
            the memorial ceremony but stopped preparing dozens of dishes, while others have started rotating who hosts. If
            more people were willing to adapt like that, I think holidays could become meaningful again rather than
            something to survive.
          phrases: [reflects a deeper gap between, In that context, it's no surprise that, more of a symptom than a solution]
        - text: >-
            I think this issue is more complicated than it first appears. On one hand, the complaints about holiday stress
            are completely valid. Spending eight hours on the highway, cooking from dawn until night, and fielding
            personal questions about your salary or marriage plans is not most people's idea of a vacation. It's also
            worth noting that the burden has never been shared equally, and younger generations are much less willing to
            accept that. On the other hand, holidays are one of the few times when families actually sit down together,
            and in a society where everyone is so busy, that time is hard to replace. So rather than seeing it as a choice
            between keeping traditions and abandoning them, I think we should look for a middle ground. The government and
            companies could help by encouraging people to spread their vacation days around the holidays, which would ease
            traffic. Families, meanwhile, could agree on simpler meals and fairer roles. In the end, a holiday should
            leave people feeling closer to each other, not more exhausted, and I believe that's achievable with a bit of
            flexibility.
          phrases: [more complicated than it first appears, On one hand, It's also worth noting that, rather than seeing it as a choice between]
