# OPIc 결과 화면의 스스로 점검표. 문항 유형마다 4개.
schema_version: 1
self_intro:
  - 이름보다 하는 일·사는 곳·좋아하는 것을 중심으로 말했어요
  - 문장 네다섯 개 이상으로 1분 가까이 말했어요
  - 외운 티가 나지 않게 중간에 내 생각을 한 마디 넣었어요
  - 마지막에 한 문장으로 마무리했어요
description:
  - 전체 모습을 한 문장으로 먼저 말했어요
  - 장소·사물을 두세 가지로 나눠 구체적으로 묘사했어요
  - 내가 그곳·그것을 좋아하는 이유를 붙였어요
  - 1분 이상 말했어요
routine:
  - 언제, 누구와, 얼마나 자주를 말했어요
  - 순서(first, then, after that)를 넣어 하루나 과정을 설명했어요
  - 현재형으로 습관을 말했어요
  - 그 일을 하면 어떤 기분인지 덧붙였어요
past_experience:
  - 언제, 어디서 있었던 일인지 먼저 말했어요
  - 과거형을 끝까지 지켰어요
  - 일어난 일을 순서대로 말했어요
  - 그 일로 느낀 점이나 바뀐 점으로 마무리했어요
comparison:
  - 예전과 지금(또는 두 대상)을 분명히 나눠 말했어요
  - 바뀐 점을 두 가지 이상 말했어요
  - 왜 바뀌었는지 이유를 말했어요
  - 비교급(more, less, better)을 썼어요
issue:
  - 사람들이 걱정하는 문제가 무엇인지 먼저 설명했어요
  - 내 의견을 분명히 말했어요
  - 예시나 들은 이야기를 붙였어요
  - 해결 방법이나 바람을 한 마디 했어요
roleplay_ask:
  - 상황에 맞게 인사하고 왜 연락했는지 말했어요
  - 질문을 세 개 이상 했어요
  - Can I…? / Do you…? / How much…? 처럼 질문 형태를 바꿔 썼어요
  - 고맙다는 말로 마무리했어요
roleplay_solve:
  - 무슨 문제가 생겼는지 상대에게 먼저 설명했어요
  - 대안을 두 가지 이상 냈어요
  - 상대 입장을 묻는 말을 넣었어요
  - 정중한 표현(I'm sorry, Would it be possible…)을 썼어요
roleplay_experience:
  - 비슷한 문제를 겪은 때와 장소를 말했어요
  - 무슨 일이 있었는지 과거형으로 순서대로 말했어요
  - 어떻게 해결했는지 말했어요
  - 그 일로 배운 점으로 마무리했어요
