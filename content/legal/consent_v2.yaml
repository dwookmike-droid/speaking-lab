# 개인정보 수집·이용 동의서 v2 — 원본이에요. (v1과 달라진 점: 학원 서버(Supabase)에 저장, 로그인을 아이디·PIN으로, Cloudflare 제거)
# 앱 동의 화면(app/data/consent.json), 인쇄용 양식(app/consent.html), 문서(docs/legal/...v1.md)는 모두
# tools/build.py가 이 파일에서 만들어요. 내용을 바꾸면 consent_version을 올리고 새 파일(consent_v2.yaml)로 써요.
# {name} {phone} {email} {retention}은 아래 operator·retention 값으로 바뀌어요.
consent_version: 2
status: draft                # 전문가 검토 전 초안. 검토가 끝나면 reviewed
effective: null              # 쓰기 시작하는 날 (예: 2026-11-10)
title: Speaking Lab 개인정보 수집·이용 동의서
operator:                    # Mike가 채워요
  name: "[선생님 이름]"
  phone: "[휴대폰]"
  email: "[이메일]"
retention: 수업 종료 후 3개월
intro: >-
  Speaking Lab은 {name}이(가) 과외 수업을 듣는 학생에게만 제공하는 토익스피킹·OPIc 말하기 연습 웹앱이에요.
  서비스는 아래와 같이 개인정보를 모으고 써요. 내용을 읽고 동의 여부를 골라 주세요.
sections:
  - id: operator
    title: 1. 개인정보 처리자
    bullets:
      - "이름: {name}"
      - "연락처: {phone} · {email}"
      - 개인정보 관련 문의·열람·정정·삭제·동의 철회는 위 연락처로 요청하면 지체 없이 처리해요.
  - id: required
    title: "2. [필수] 개인정보 수집·이용 동의"
    table:                       # 행마다 [항목, 목적]. 보유 기간 칸은 build.py가 retention으로 붙여요
      head: [항목, 목적, 보유 기간]
      retention_col: true
      rows:
        - ["이름, 로그인 아이디, 휴대폰 번호, 만 14세 미만 여부", "학생 확인, 로그인, 수업 연락"]
        - ["응시 시험, 목표 레벨", "목표 레벨에 맞는 모범답변·피드백 제공"]
        - ["답변 녹음(음성), 녹음을 받아 적은 글(전사본), 응시 기록", "말하기 피드백 작성, 학습 기록 관리"]
    bullets:
      - 학생 정보·응시 기록·녹음은 학원 서버(Supabase, 서울 리전)에 저장하고, 피드백을 쓸 때 선생님 컴퓨터로 내려받아요. 전사본은 선생님 컴퓨터에만 있어요.
      - 다른 학생은 내 정보와 녹음을 볼 수 없어요. 선생님 계정만 모든 학생 자료를 봐요.
      - 보유 기간이 끝나거나 동의를 철회하면 지체 없이 지워요.
      - "동의를 거부할 수 있어요. 다만 필수 항목에 동의하지 않으면 서비스를 이용할 수 없어요. 수업은 서비스 없이도 계속 받을 수 있어요."
    check: {key: required, required: true, label: 필수 항목 수집·이용에 동의해요.}
  - id: optional
    title: "3. [선택] 개인정보 수집·이용 동의"
    table:
      head: [항목, 목적, 보유 기간]
      retention_col: true
      rows:
        - ["시험 예정일, 현재 점수·등급, 학년 또는 직업", "학습 일정과 문항 난이도 맞추기"]
    bullets:
      - 동의하지 않아도 서비스를 이용할 수 있어요. 일정·난이도 추천만 빠지고, 입력한 선택 항목은 저장하지 않아요.
    check: {key: optional, required: false, label: 선택 항목 수집·이용에 동의해요.}
  - id: processors
    title: "4. 개인정보 처리 위탁"
    paragraphs:
      - 서비스를 운영하려고 아래 회사에 일을 맡겨요. 맡긴 일 외에는 개인정보를 쓰지 못하게 되어 있어요.
    table:
      head: [받는 곳, 맡기는 일, 저장 위치]
      rows:
        - ["Supabase, Inc. (미국 회사)", "학생 정보·응시 기록·녹음 저장, 로그인", "대한민국(서울 리전)"]
        - ["GitHub, Inc. (미국 회사)", "앱 화면 배포 — 개인정보를 저장하지 않아요(접속 기록만)", "해외"]
  - id: overseas
    title: "5. [필수] 개인정보 국외 이전 동의"
    paragraphs:
      - 피드백 초안을 쓰는 데 해외 AI 서비스를 써요.
    table:
      head: [받는 곳 (나라), 이전 항목, 목적, 시기·방법, 보유 기간]
      rows:
        - ["Anthropic, PBC (미국)", "이름·연락처를 뺀 전사본, 학생 번호, 목표 레벨", AI로 말하기 피드백 초안 작성, "제출할 때마다, 선생님이 Claude에 입력", "Anthropic 정책에 따름. 선생님 계정에서 모델 학습 사용을 꺼 둬요"]
    bullets:
      - 녹음 음성 파일은 AI에 보내지 않아요. 받아 적기는 선생님 컴퓨터에서 해요.
      - "동의를 거부할 수 있어요. 거부하면 AI 피드백을 쓸 수 없어서 서비스를 이용할 수 없어요. 이 경우 선생님이 녹음을 직접 듣고 피드백할 수 있는지 따로 이야기해요."
    check: {key: overseas, required: true, label: 국외 이전에 동의해요.}
  - id: guardian
    title: 6. 만 14세 미만 학생 — 법정대리인 동의
    only_if: under14             # 앱에서는 만 14세 미만이라고 고른 학생에게만 보여요
    paragraphs:
      - 만 14세 미만 학생은 법정대리인(보호자)의 동의가 있어야 해요.
    fields: [보호자 이름, 학생과의 관계, 보호자 연락처, 보호자 확인 방법]
    check: {key: guardian, required: true, label: 법정대리인으로서 위 2~5항 내용을 확인하고 동의해요.}
  - id: rights
    title: 7. 정보주체의 권리
    paragraphs:
      - >-
        학생(만 14세 미만이면 보호자)은 언제든 개인정보 열람, 정정, 삭제, 처리 정지, 동의 철회를 요청할 수 있어요.
        앱 설정의 "동의 철회"를 누르면 서버에 있는 내 녹음·응시 기록이 바로 지워지고, 선생님 컴퓨터에 있는 자료도 지워요. 1항 연락처로 알려 줘도 돼요.
