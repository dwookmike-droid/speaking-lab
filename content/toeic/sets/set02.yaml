  - num: 11
    type: opinion
    question: >-
      Which do you think is better for completing team projects: working together in the same office, or working remotely
      from home? Use specific reasons and examples to support your opinion.
    model:
      lv5:
        - text: >-
            I think working together in the office is better. I have two reasons. First, we can talk face to face. It is fast and
            easy. Second, we can solve problems together. For example, in my team, we had a problem last month. We met in a meeting
            room and fixed it in one hour. So I prefer the office.
          phrases: [I have two reasons, First, Second, For example]
        - text: >-
            I think working remotely is better for team projects. First, I can save time. I don't need to take the bus to work.
            Second, I can focus at home. The office is noisy. For example, my friend works at home. She says she finishes her work
            faster. So I like working remotely.
          phrases: [First, Second, For example]
      lv6:
        - text: >-
            I think working together in the office is better for team projects. There are two reasons. First, communication is much
            faster. If I have a question, I can just walk to my coworker's desk and ask. Online, I have to wait for an answer.
            Second, it is easier to build a good relationship with team members. For example, last year my team worked on a big
            project in the office. We had lunch together every day, and we became close. Because of that, we worked well as a team.
            For these reasons, I prefer the office.
          phrases: [There are two reasons, Because of that, For these reasons]
        - text: >-
            In my opinion, working remotely is better for team projects. I have two reasons. First, people can work at their best
            time. Some people focus better in the morning, and some people focus better at night. Second, we don't waste time on
            long meetings. For example, my team uses an online chat and a shared document. We write our ideas there, so we only
            meet once a week for thirty minutes. This saves a lot of time. So I think working remotely is better.
          phrases: [In my opinion, Some people ~ and some people, This saves]
      lv7:
        - text: >-
            I believe working together in the same office is better for team projects. I have two main reasons. First, it's much
            easier to share ideas when everyone is in the same room. In a face-to-face meeting, people can react right away, and one
            idea often leads to another. Second, problems can be solved more quickly. For example, when I was working on a product
            launch last year, our designer noticed a mistake in the plan. Because we were sitting next to each other, we fixed it in
            ten minutes. If we had been working from home, it probably would have taken a whole day of emails. For these reasons,
            I think the office is the better choice for team projects.
          phrases: [I have two main reasons, one idea often leads to another, Because we were]
        - text: >-
            In my opinion, working remotely is better for team projects. First of all, it gives team members more time to focus.
            In an office, people are often interrupted by phone calls and small talk. At home, it's quieter, so they can finish their
            part of the project faster. Second, remote work makes it easier to work with people in different places. For example,
            last semester I did a group project with classmates who lived in three different cities. We used video calls and a
            shared online folder, and we finished the project a week early. Without remote tools, that would have been impossible.
            Therefore, I think working remotely is the better option.
          phrases: [First of all, makes it easier to, Without ~ that would have been, Therefore]
      lv8:
        - text: >-
            Personally, I think working together in the same office is better for team projects, even though remote work has become
            very common. The main reason is that teamwork depends on trust, and trust is much easier to build in person. When you
            see your coworkers every day, you notice when someone is struggling, and you can offer help before a small problem
            becomes a big one. I learned this from experience. At my previous job, our team was fully remote for about a year, and
            although everyone was working hard, we kept missing small details because nobody wanted to bother each other with
            questions. After we moved back to the office, those misunderstandings almost disappeared, and our projects started
            finishing on schedule. So overall, I believe sharing the same space makes a team work more smoothly.
          phrases: [even though, The main reason is that, I learned this from experience, So overall]
        - text: >-
            I'd argue that working remotely is actually better for team projects, as long as the team has clear rules. The biggest
            advantage is flexibility. When people can choose where and when they work, they tend to be more productive and less
            stressed. For example, my current team is spread across two different cities, and we work almost entirely online.
            At first, I was worried that communication would suffer, but we set up a simple system: a short video call every
            morning, and everything else goes into a shared project board. Because every decision is written down, nobody misses
            important information, and new members can catch up quickly. Honestly, our projects run more smoothly now than when we
            all shared an office. So I'd say remote work is the better choice.
          phrases: [I'd argue that, as long as, The biggest advantage is, At first ~ but]
