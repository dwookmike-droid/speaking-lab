items:
  - num: 1
    type: read_aloud
    text: >-
      Good morning, this is Rachel Kim with your morning traffic and weather update. Traffic is moving slowly on Highway 9
      because of road repairs near the river bridge, so drivers should allow an extra twenty minutes. Downtown streets are clear.
      As for the weather, expect cloudy skies, light rain, and strong winds this afternoon. The rain should stop by tomorrow morning.
      Stay tuned for more news after this short break.
    marks: >-
      Good **mor**ning, / this is Rachel **Kim** / with your morning **traf**fic and **weath**er update. //
      Traffic is moving **slow**ly on Highway **9** / because of road re**pairs** / near the river **bridge**, /
      so drivers should allow an extra twenty **min**utes. // Downtown streets are **clear**. //
      As for the **weath**er, / expect **cloud**y skies, ↗ / light **rain**, ↗ / and strong **winds** ↘ / this after**noon**. //
      The rain should **stop** / by tomorrow **mor**ning. // Stay tuned for more **news** / after this short **break**.
    tip_ko: 교통·날씨 안내는 숫자와 지명이 많아요. Highway 9처럼 숫자가 붙은 이름은 한 덩어리로 읽고, 날씨 나열은 마지막 항목에서 내려요.
  - num: 2
    type: read_aloud
    text: >-
      Thank you for calling Maple Grove Dental Clinic. Our office is open from nine a.m. to six p.m., Monday through Friday,
      and from nine a.m. to one p.m. on Saturdays. To make or change an appointment, press one. For questions about insurance,
      payments, or billing, press two. If you are having a dental emergency, please press three to speak with a nurse right away.
      Thank you for your patience.
    marks: >-
      Thank you for calling Maple Grove **Den**tal Clinic. // Our office is open / from nine **a.m.** to six **p.m.**, /
      Monday through **Fri**day, / and from nine a.m. to one p.m. / on **Sat**urdays. //
      To make or change an ap**point**ment, / press **one**. // For questions about **in**surance, ↗ / **pay**ments, ↗ / or **bill**ing, ↘ /
      press **two**. // If you are having a dental e**mer**gency, / please press **three** / to speak with a nurse / right a**way**. //
      Thank you for your **pa**tience.
    tip_ko: 전화 안내 메시지는 '번호 누르기' 문장이 반복돼요. press one, press two처럼 숫자에 힘을 주고, 문장마다 같은 리듬으로 읽어요.
  - num: 3
    type: describe_photo
    image: img/toeic/set02_q3.svg
    credit: placeholder-set02-q3
    model:
      lv5:
        - text: This is a picture of a library. A woman is taking a book from a shelf. A man is reading a book at a table.
          phrases: [This is a picture of]
        - text: I can see a library. On the left, there is a big bookshelf. On the right, a man is wearing headphones. He is reading.
          phrases: [I can see, On the left, On the right]
      lv6:
        - text: >-
            This picture was taken in a library. On the left side, a woman with long hair is reaching for a book on the shelf.
            On the right side, a man is sitting at a table and reading a book. There is a lamp on the table.
          phrases: [This picture was taken in, On the left side, On the right side]
        - text: >-
            This is a picture of a quiet library. The first thing I see is a tall bookshelf full of colorful books. A woman is
            standing in front of it. On the right, a man with headphones is reading at a long table.
          phrases: [The first thing I see is, full of, in front of]
      lv7:
        - text: >-
            This picture was taken in a library. On the left, there is a tall wooden bookshelf filled with colorful books.
            A woman with long dark hair is reaching up to take a book from an upper shelf. On the right, a man wearing headphones
            is reading a book at a long table. It looks like a calm place to study.
          phrases: [filled with, reaching up to, It looks like]
        - text: >-
            The first thing I notice in this picture is a man studying at a table. He is wearing headphones and reading an open
            book. There is a yellow lamp next to him and a red backpack on a chair. On the other side of the room, a woman is
            looking for a book on a large bookshelf.
          phrases: [The first thing I notice, next to him, On the other side of the room]
      lv8:
        - text: >-
            This picture shows the inside of a library. On the left, a woman in a teal top is standing in front of a tall wooden
            bookshelf, and she's reaching up to pull out a purple book. On the right, a young man wearing headphones is sitting at
            a long table, completely focused on the book in front of him. Since there's a desk lamp and a backpack nearby, I think
            he's been studying here for a while.
          phrases: [This picture shows, completely focused on, Since, I think]
        - text: >-
            This is a scene from a quiet library. What stands out most is the tall bookshelf on the left, which is packed with books
            of different colors. A woman is stretching her arm toward an upper shelf to grab a book. Meanwhile, a man with headphones
            is reading at a wooden table with a yellow lamp, and someone's red backpack has been left on a chair at the end of the
            table.
          phrases: [What stands out most is, which is packed with, Meanwhile]
    tip_ko: 공간이 둘로 나뉜 사진은 왼쪽 → 오른쪽 순서로 말하면 빠뜨리는 게 없어요. 동작(reaching, reading)은 현재진행형으로 말해요.
