    tip_ko: 날씨가 보이는 사진은 첫 문장에 넣어요(on a rainy day). 사람마다 옷 색깔이나 소지품을 하나씩 붙이면 묘사가 쉬워져요.
  - num: 5
    type: respond_q
    context: >-
      Imagine that a research company is doing a telephone survey in your country. You have agreed to answer some questions
      about smartphones and mobile apps.
    question: How many hours a day do you use your smartphone, and what do you mostly use it for?
    model:
      lv5:
        - text: I use my smartphone about four hours a day. I mostly watch videos.
        - text: I use it for about three hours a day. I usually send messages to my friends.
      lv6:
        - text: I use my smartphone for about five hours a day. I mostly use it to watch videos and check the news on the subway.
        - text: I think I use my phone for about three hours a day. I mainly use it for messaging and listening to music.
      lv7:
        - text: >-
            I use my smartphone for about four hours a day. Most of the time, I use it to check my email and messages, but I also
            watch videos before bed.
          phrases: [Most of the time, but I also]
        - text: >-
            Honestly, I probably use my phone for more than five hours a day. I mostly use it for social media and online banking,
            especially during my commute.
          phrases: [Honestly, especially]
      lv8:
        - text: >-
            To be honest, I use my smartphone for around six hours a day, which is probably too much. I mostly use it for work
            emails during the day, and in the evening I watch short videos to relax.
          phrases: [To be honest, which is probably too much]
        - text: >-
            I'd say I spend about three hours a day on my smartphone. Most of that time goes to reading news articles and listening
            to podcasts on my way to work, since my commute takes almost an hour.
          phrases: [I'd say, Most of that time goes to, since]
    tip_ko: 시간과 용도, 질문이 두 개예요. 숫자로 먼저 답하고, 용도는 하나만 구체적으로 말해도 충분해요.
  - num: 6
    type: respond_q
    question: When was the last time you downloaded a new app, and what kind of app was it?
    model:
      lv5:
        - text: I downloaded a new app last week. It was a weather app.
        - text: The last time was two days ago. I downloaded a game app.
      lv6:
        - text: The last time I downloaded a new app was last month. It was a language learning app, because I want to study Japanese.
        - text: I downloaded a new app three days ago. It was a map app, and I use it to find bus times.
      lv7:
        - text: >-
            The last time I downloaded a new app was about a week ago. It was a budgeting app that tracks my spending, and I've been
            checking it every day since then.
          phrases: [The last time I ~ was, I've been ~ since then]
        - text: >-
            I downloaded a new app yesterday, actually. It was a photo editing app, because I wanted to make my vacation pictures
            look a little better.
          phrases: [actually]
      lv8:
        - text: >-
            The last time was just last weekend. My company started using a new messaging app for team communication, so I had to
            download it. It took a while to get used to, but now I find it really convenient.
          phrases: [It took a while to get used to, I find it]
        - text: >-
            I think it was about two weeks ago. I downloaded a note-taking app because a coworker recommended it, and it's been
            surprisingly useful. It even syncs my notes between my phone and my laptop automatically.
          phrases: [it's been surprisingly useful, It even]
    tip_ko: 언제, 어떤 앱인지 두 가지를 답해요. 지난 일이라 downloaded, was처럼 과거형을 지켜요.
  - num: 7
    type: respond_q
    question: Would you prefer to use a free app with advertisements or pay for the same app without any ads? Why?
    model:
      lv5:
        - text: I prefer a free app with ads. First, I don't want to spend money. Second, the ads are short, so they are okay.
          phrases: [First, Second]
        - text: I prefer to pay for the app. Ads are very annoying. Also, I use the app every day, so paying is better.
          phrases: [Also]
      lv6:
        - text: >-
            I would prefer to pay for the app without ads. First, ads are really annoying when I am busy. Second, I use some apps
            every day, so a few dollars is not expensive for me. So I think paying is a better choice.
          phrases: [First, Second, So I think]
        - text: >-
            I prefer to use a free app with ads. The main reason is money. I use many different apps, so paying for all of them is
            too expensive. Also, I can just skip most ads after a few seconds.
          phrases: [The main reason is, Also]
      lv7:
        - text: >-
            I would prefer to pay for an app without any ads. The main reason is that ads interrupt what I'm doing. For example,
            when I'm studying with a vocabulary app, a long video ad sometimes pops up and I lose my focus. Paying a few dollars is
            worth it if I can use the app comfortably. That's why I'd choose the paid version.
          phrases: [The main reason is that, For example, is worth it, That's why]
        - text: >-
            Personally, I prefer free apps with advertisements. First of all, I'm a student, so I need to save money wherever I can.
            Also, I usually try an app for a few weeks and then stop using it, so paying for it would be a waste. Watching a few ads
            is a small price to pay.
          phrases: [First of all, would be a waste, a small price to pay]
      lv8:
        - text: >-
            Honestly, I'd much rather pay for the version without ads. The biggest reason is that I value my time. For instance,
            I use a navigation app almost every day, and when an ad pops up while I'm trying to find my way, it's not just annoying
            but actually distracting. A few dollars a month is a small cost compared to the stress it saves me, so I'm happy to pay
            for apps I use regularly.
          phrases: [I'd much rather, not just ~ but, compared to]
        - text: >-
            It really depends on the app, but in general I'd go with the free version. Most of the apps on my phone are ones I only
            open once or twice a week, so the ads don't bother me that much. If I paid for every single app, those small charges
            would add up quickly. However, if I started using an app every day, I'd probably upgrade to the paid version.
          phrases: [It really depends on, would add up, However, if I]
    tip_ko: 둘 중 하나를 고르는 질문이에요. 첫 문장에서 고르고, 이유 하나에 내 경험을 붙이면 30초가 채워져요.
