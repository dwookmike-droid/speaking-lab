  - num: 11
    type: opinion
    question: >-
      Which is more important when choosing a job: a high salary or good relationships with coworkers? Give specific reasons and
      examples to support your opinion.
    model:
      lv5:
        - text: >-
            I think good coworkers are more important. I have two reasons. First, I see my coworkers every day. Second, work is easier
            when people help me. For example, at my part-time job, my coworkers were very kind. I was happy at work. So I think coworkers
            are more important.
          frame: [의견, 이유1, 이유2, 예시, 마무리]
          phrases: [I have two reasons, First, Second, For example]
        - text: >-
            I think a high salary is more important. First, I need money to live. Rent and food are expensive. Second, I want to save
            money for the future. For example, my friend got a job with a high salary. He bought a car last year. So I choose a high
            salary.
          frame: [의견, 이유1, 이유2, 예시, 마무리]
          phrases: [First, Second, For example]
      lv6:
        - text: >-
            In my opinion, good relationships with coworkers are more important than a high salary. There are two reasons. First, I spend
            more time with my coworkers than with my family on weekdays, so a friendly team makes every day better. Second, good coworkers
            help me learn faster. For example, at my first job, a senior coworker taught me how to use our sales program, and I got used
            to my work in just two weeks. For these reasons, I think coworkers matter more.
          frame: [의견, 이유1, 이유2, 예시, 마무리]
          phrases: [In my opinion, There are two reasons, For these reasons]
        - text: >-
            I think a high salary is more important when choosing a job. First, money gives me more choices in life. I can travel, take
            classes, and help my parents. Second, relationships can change, because people often move to other teams or companies. But a
            salary stays with me. For example, my cousin left a friendly company for a job with a higher salary. Now she can save money
            every month, and she is much less stressed. That's why I prefer a high salary.
          frame: [의견, 이유1, 이유2, 예시, 마무리]
          phrases: [First, Second, "That's why"]
      lv7:
        - text: >-
            Personally, I think good relationships with coworkers are more important than a high salary. The first reason is stress. Even
            if the pay is great, going to work every day feels terrible when people don't get along. The second reason is growth. When
            coworkers trust each other, they share tips and give honest feedback, so everyone improves faster. For example, I worked at a
            small design company a few years ago. The salary wasn't very high, but my team always helped each other with deadlines, and I
            learned more there than anywhere else. Looking back, I'd choose a team like that again. So, for me, coworkers come first.
          frame: [의견, 이유1, 이유2, 예시, 마무리]
          phrases: [Personally, The first reason is, The second reason is, Looking back]
        - text: >-
            I'd say a high salary is more important, especially at the start of a career. First of all, a good salary lets you pay off
            student loans and start saving early, which reduces a lot of stress. On top of that, salary is something you can actually
            compare before you accept a job, while relationships with coworkers are hard to predict. For instance, my friend chose a
            company because the interviewers seemed friendly, but half of his team quit within six months. If he had chosen the
            higher-paying offer, he would at least have had financial security. That's why I'd focus on the salary first.
          frame: [의견, 이유1, 이유2, 예시, 마무리]
          phrases: [First of all, On top of that, For instance, If he had chosen]
      lv8:
        - text: >-
            Honestly, I believe good relationships with coworkers matter more than a high salary in the long run. To begin with, we spend
            around forty hours a week at work, and a tense atmosphere can make even a well-paid job feel exhausting. A raise might make
            you happy for a month, but daily conflicts wear you down for years. Moreover, supportive coworkers can actually boost your
            career. They introduce you to new projects, cover for you when you're sick, and give you honest feedback. I experienced this
            myself when I joined a marketing team where everyone shared ideas openly. My salary was average, but I was promoted within two
            years because my teammates recommended me for a major project. So if I had to choose, I'd pick a great team over a bigger
            paycheck, because a good team often helps the paycheck grow later anyway.
          frame: [의견, 이유1, 이유2, 경험, 마무리]
          phrases: [in the long run, To begin with, Moreover, if I had to choose]
        - text: >-
            While good coworkers are important, I'd argue that a high salary should come first when choosing a job. The biggest reason is
            that a salary affects every part of your life, not just the hours you spend at the office. It decides where you can live, how
            much you can save, and whether you can support your family. Another reason is that relationships at work are unpredictable.
            Your favorite manager might move to another branch next month, and a new team member could completely change the atmosphere.
            A contract, on the other hand, is something you can rely on. My older brother is a good example. He turned down a friendly
            startup for a better-paying job at a large company, and that extra income allowed him to buy his first apartment three years
            earlier than he expected. That's why I'd prioritize the salary.
          frame: [양보, 의견, 이유1, 이유2, 예시, 마무리]
          phrases: ["I'd argue that", The biggest reason is, on the other hand, is a good example]
    tip_ko: 둘 중 하나를 첫 문장에서 분명히 골라요. 이유 두 개에 내 경험이나 주변 사람 이야기를 하나 붙이면 60초가 자연스럽게 채워져요.
