  - num: 5
    type: respond_q
    context: >-
      Imagine that a clothing company is doing research in your country. You have agreed to take part in a telephone interview about
      shopping for clothes.
    question: When was the last time you bought clothes, and what did you buy?
    model:
      lv5:
        - text: The last time I bought clothes was last weekend. I bought a black jacket.
          frame: [언제, 무엇]
          phrases: [The last time I bought clothes was]
        - text: I bought clothes two weeks ago. I bought a white T-shirt and jeans.
          frame: [언제, 무엇]
          phrases: [two weeks ago]
      lv6:
        - text: The last time I bought clothes was about a month ago. I bought a warm sweater because the weather was getting cold.
          frame: [언제, 무엇, 이유]
          phrases: [about a month ago, because]
        - text: I went shopping for clothes last Saturday with my sister. I bought a pair of running shoes and a gray hoodie.
          frame: [언제, 누구와, 무엇]
          phrases: [went shopping for, a pair of]
      lv7:
        - text: >-
            I bought some clothes just last week, actually. I needed a new shirt for a job interview, so I picked a light blue one that
            looks clean and professional.
          frame: [언제, 이유, 무엇]
          phrases: [actually, so I picked]
        - text: >-
            The last time I bought clothes was about three weeks ago. I got a long winter coat online because it was on sale for half
            the regular price.
          frame: [언제, 무엇, 이유]
          phrases: [on sale, half the regular price]
      lv8:
        - text: >-
            I think it was about two weeks ago. I was getting ready for my friend's wedding, so I bought a navy suit and a matching tie
            at a department store near my office.
          frame: [언제, 상황, 무엇·어디서]
          phrases: [I think it was, getting ready for, matching]
        - text: >-
            Actually, I bought something just yesterday. My old sneakers had a hole in them, so I ordered a new pair online, and I also
