  - num: 1
    type: read_aloud
    text: >-
      Thank you for choosing Riverside Fitness Center. We are happy to announce that our new yoga studio on the second floor will open
      next Monday. To celebrate, members can join any morning, afternoon, or evening yoga class for free during the first week. Please
      note that the swimming pool will be closed this weekend for regular cleaning. For more information, visit the front desk or check
      our website.
    marks: >-
      Thank you for choosing / Riverside **Fit**ness Center. // We are happy to an**nounce** / that our new **yo**ga studio / on the
      second **floor** / will open next **Mon**day. // To **cel**ebrate, / members can join any **mor**ning, ↗ / **af**ternoon, ↗ /
      or **eve**ning yoga class ↘ / for **free** / during the first **week**. // Please **note** / that the swimming **pool** / will be
      **closed** this weekend / for regular **clean**ing. // For more infor**ma**tion, / visit the front **desk** / or check our
      **web**site.
    tip_ko: morning, afternoon, or evening처럼 셋을 나열할 때는 앞의 둘은 올리고 마지막은 내려요. free, closed처럼 바뀐 소식에 힘을 줘요.
  - num: 2
    type: read_aloud
    text: >-
      In local news, the new Westbrook Bridge will finally open to traffic this Friday morning. The bridge connects the downtown area,
      the harbor, and the university campus. City officials say it will shorten travel times by about fifteen minutes during rush hour.
      A free walking tour of the bridge will be held on Saturday at ten a.m. Stay tuned for sports and weather after this short break.
    marks: >-
      In local **news**, / the new **West**brook Bridge / will finally open to **traf**fic / this Friday **mor**ning. // The bridge
      con**nects** / the **down**town area, ↗ / the **har**bor, ↗ / and the uni**ver**sity campus. ↘ // City of**fi**cials say / it
      will **short**en travel times / by about **fif**teen minutes / during **rush** hour. // A free **walk**ing tour of the bridge /
      will be held on **Sat**urday / at ten **a.m.** // Stay **tuned** / for **sports** and **wea**ther / after this short **break**.
    tip_ko: 뉴스는 고유명사(Westbrook Bridge)와 숫자(fifteen, ten a.m.)를 또박또박 읽어요. 마지막 문장은 다음 순서를 알리는 말이라 밝게 끝내요.
