  - num: 6
    type: respond_q
    question: Do you usually shop for clothes alone or with other people? Why?
    model:
      lv5:
        - text: I usually shop alone. I can take my time and choose slowly.
          frame: [답, 이유]
          phrases: [I usually, take my time]
        - text: I usually shop with my mother. She gives me good advice.
          frame: [답, 이유]
          phrases: [I usually, good advice]
      lv6:
        - text: I usually shop for clothes alone because I don't like waiting for other people. I can look around as long as I want.
          frame: [답, 이유, 덧붙임]
          phrases: [because, as long as I want]
        - text: I usually go shopping with my best friend. She has good taste, so she helps me choose clothes that look good on me.
          frame: [답, 이유]
          phrases: [has good taste, look good on me]
      lv7:
        - text: >-
            I usually shop with my younger sister. She's honest, so she always tells me if something doesn't look good on me. That helps
            me avoid buying the wrong things.
          frame: [답, 이유, 결과]
          phrases: [doesn't look good on me, That helps me]
        - text: >-
            Most of the time, I shop for clothes alone. When I go with friends, I end up following their schedule, but alone, I can
            focus and finish quickly.
          frame: [답, 비교, 이유]
          phrases: [Most of the time, I end up]
      lv8:
        - text: >-
            I usually shop for clothes alone, to be honest. I already know what styles suit me, so I can compare prices and try things on without
            worrying about keeping anyone waiting.
          frame: [답, 이유, 장점]
          phrases: [to be honest, suit me, without worrying about]
        - text: >-
            I normally go shopping with my girlfriend, since she has a great eye for colors. Plus, shopping together turns into a fun
            date, and we usually grab dinner together afterward.
          frame: [답, 이유1, 이유2]
          phrases: [has a great eye for, Plus, afterward]
    tip_ko: 혼자인지 누구와인지 먼저 한 문장으로 답하고, 이유를 하나 붙여요. 'good advice'처럼 짧은 이유도 괜찮아요.
  - num: 7
    type: respond_q
    question: Would you rather buy clothes online or at a store? Why?
    model:
      lv5:
        - text: I would rather buy clothes at a store. I can try them on first. Also, I can see the real color. So I like stores.
          frame: [답, 이유1, 이유2, 마무리]
          phrases: [I would rather, try them on, Also]
        - text: I prefer to buy clothes online. It is cheap and easy. I can shop at home at night. The delivery is fast too.
          frame: [답, 이유1, 이유2, 덧붙임]
          phrases: [I prefer to, at home]
      lv6:
        - text: >-
            I would rather buy clothes at a store. First, I can try them on, so I know the size is right. Second, I can touch the
            material. When I buy online, the clothes often look different from the pictures.
          frame: [답, 이유1, 이유2, 경험]
          phrases: [First, Second, look different from]
        - text: >-
            I prefer buying clothes online because it saves time. I don't have to go to the mall, and I can compare prices on different
            websites. Also, most shops let me return clothes for free if they don't fit.
          frame: [답, 이유1, 이유2, 덧붙임]
          phrases: [saves time, compare prices, for free]
      lv7:
        - text: >-
            I'd rather buy clothes at a store. The main reason is the size. Every brand's sizes are a little different, so I need to try
            things on. Last month, I ordered pants online, but they were too short, and returning them was a hassle. Since then, I've
            mostly shopped in person.
          frame: [답, 이유, 예시, 마무리]
          phrases: [The main reason is, was a hassle, Since then]
        - text: >-
            I'd rather shop online for a couple of reasons. First, there's a much wider selection than in local stores. Second, I can read
            other customers' reviews, which helps me choose the right size. For example, I bought a jacket online last winter after
            reading the reviews, and it fit perfectly.
          frame: [답, 이유1, 이유2, 예시]
          phrases: [for a couple of reasons, which helps me, fit perfectly]
      lv8:
        - text: >-
            Personally, I'd rather buy clothes at a store. Online shopping is convenient, but I've been disappointed too many times when
            the fabric felt cheap or the color looked different in person. When I shop at a store, I can check the quality, try on a few
            sizes, and walk out with something I know I'll actually wear. It might take more time, but it's worth it.
          frame: [답, 반대쪽 단점, 이유, 마무리]
          phrases: [Personally, in person, walk out with, it's worth it]
        - text: >-
            I'd definitely choose online shopping. I work long hours, so it's hard to visit the mall on weekdays, and on weekends it's way
            too crowded. Online, I can browse whenever I have a few free minutes, like on the subway. Plus, many stores now offer free
            returns, so if something doesn't fit, I just send it back without any extra cost.
          frame: [답, 상황, 이유1, 이유2]
          phrases: [I'd definitely choose, way too crowded, Plus, send it back]
    tip_ko: 30초 문항이에요. 답 → 이유 두 개 → 짧은 경험 순서로 말하면 시간이 알맞게 차요. 사이즈, 가격, 시간처럼 구체적인 이유를 골라요.
