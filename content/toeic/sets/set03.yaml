            with some birds. Two people are resting on a bench next to the pond. It looks peaceful.
          phrases: [Behind him, next to, It looks]
      lv7:
        - text: >-
            This picture was taken in a park on a bright, sunny day. On the left side, a woman wearing a yellow coat is walking a small
            brown dog on a leash. In the center, a man in a red shirt is jogging along the path. On the right, an older couple is
            sitting on a bench by a pond.
          phrases: [On the left side, wearing, In the center, by a pond]
        - text: >-
            The first thing I notice is a man in a red shirt who is jogging through the park. Not far from him, a woman is taking her dog
            for a walk. Two people with gray hair are relaxing on a wooden bench next to a pond. It seems like a perfect day to be outside.
          phrases: [The first thing I notice is, Not far from him, It seems like]
      lv8:
        - text: >-
            This is a scene from a city park on a clear, sunny day. On the left, a woman in a yellow coat is walking her brown dog along
            a dirt path. In the middle, a man wearing a white headband is jogging, and he looks pretty focused. On the right, an older
