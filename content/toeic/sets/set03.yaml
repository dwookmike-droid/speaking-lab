    tip_ko: 사람이 셋 이상이면 다 자세히 말하려고 하지 말고, 가장 눈에 띄는 인물 하나를 길게, 나머지는 한 문장씩 말해요.
  - num: 5
    type: respond_q
    context: >-
      Imagine that a marketing firm is doing research in your country. You have agreed to take part in a telephone interview about
      eating out at restaurants.
    question: How often do you eat at a restaurant, and who do you usually go with?
    model:
      lv5:
        - text: I eat at a restaurant once a week. I usually go with my family.
        - text: I go to a restaurant about twice a month. I usually go with my friends.
      lv6:
        - text: I eat at a restaurant about once a week. I usually go with my parents on Saturday evening.
        - text: I go out to eat two or three times a month. I usually go with my coworkers after work on Friday.
      lv7:
        - text: >-
            I eat out at a restaurant about twice a week. I usually go with my coworkers for lunch, because there's no cafeteria in our
            building.
        - text: >-
            I probably eat at a restaurant once or twice a week. Most of the time, I go with my best friend, and we like to try new places
            on weekends.
      lv8:
        - text: >-
            Honestly, I eat out pretty often, maybe three or four times a week. On weekdays, I usually grab lunch with my coworkers near
            the office, and on weekends, I go to a nice restaurant with my family.
        - text: >-
            I'd say I eat at a restaurant about twice a week. I usually go with my roommate, since neither of us really enjoys cooking
            after a long day, and there are lots of good places in our neighborhood.
    tip_ko: 얼마나 자주, 누구와 가는지 두 가지를 모두 답해요. 15초라 숫자 하나, 사람 하나를 말하고 이유를 짧게 붙이면 충분해요.
  - num: 6
    type: respond_q
    question: When you choose a restaurant, what is the most important thing you consider?
    model:
      lv5:
        - text: The most important thing is the price. I don't want to spend too much money.
        - text: I think the taste is the most important. I like delicious food.
      lv6:
        - text: The most important thing for me is the price. I'm a student, so I look for restaurants with cheap but good food.
        - text: When I choose a restaurant, I think about the location. I like places that are close to my home or office.
      lv7:
        - text: >-
            When I choose a restaurant, the most important thing is the reviews. I always check what other people say online, because good
            reviews usually mean good food.
        - text: >-
            For me, the most important thing is the atmosphere. If a restaurant is too noisy or crowded, I can't really enjoy my meal or
            talk with my friends.
      lv8:
        - text: >-
            I'd say the most important thing is the quality of the food. I don't mind paying a little more or waiting in line if the
            ingredients are fresh and the dishes taste great. A bad meal ruins the whole experience for me.
        - text: >-
            For me, it's definitely the location. I usually eat out with coworkers during a short lunch break, so the restaurant has to be
            within walking distance of our office. Otherwise, we spend most of our break just getting there.
    tip_ko: 기준을 하나만 골라요(가격, 맛, 위치, 분위기). "The most important thing is ~"로 시작하고 이유 한 문장을 붙여요.
  - num: 7
    type: respond_q
    question: >-
      Would you rather eat at a new restaurant you have never tried or at a restaurant you already know well? Why?
    model:
      lv5:
        - text: I prefer a restaurant I know well. First, I know the food is good. Second, I know the price, so I feel comfortable.
          phrases: [First, Second]
        - text: I would rather try a new restaurant. I like new food. Also, I can share pictures with my friends. It is fun.
          phrases: [I would rather, Also]
      lv6:
        - text: >-
            I would rather eat at a restaurant I already know well. First, I know the food is delicious, so I don't worry about the menu.
            Second, the staff know me, so the service is very friendly. That's why I prefer a familiar place.
          phrases: [I would rather, First, Second, That's why]
        - text: >-
            I prefer to try a new restaurant. First, I like trying different kinds of food from other countries. Second, it's a good way
            to make special memories with my friends. So I usually look for new places on weekends.
          phrases: [I prefer to, First, Second, So]
      lv7:
        - text: >-
            I'd rather go to a new restaurant that I've never tried. The main reason is that I get bored easily, so trying new dishes
            is part of the fun of eating out. For example, last month my friends and I found a small Vietnamese place near our school,
            and now it's one of our favorites.
          phrases: [I'd rather, The main reason is that, For example]
        - text: >-
            I would choose a restaurant I already know well. When I eat out, I don't want to take any risks. If I go to a new place,
            the food might be disappointing or more expensive than I expected. At my favorite restaurant, I always know exactly what I'm
            getting, so I can just relax.
          phrases: [I would choose, If ~, At my favorite restaurant]
      lv8:
        - text: >-
            Personally, I'd much rather go to a restaurant I already know well, especially when I'm with my family. My parents are pretty
            picky about food, so trying a new place is always a little risky. At our usual Korean barbecue restaurant, we know the menu,
            the prices, and even the owner, so everyone feels comfortable and we never end up disappointed.
          phrases: [I'd much rather, especially when, so ~ is always a little risky, end up]
        - text: >-
            I'd definitely choose a new restaurant. For me, eating out isn't just about the food; it's also about having a new experience.
            For instance, a few weeks ago I tried a small Mexican restaurant that had just opened in my neighborhood, and it turned out to be
            amazing. If I always went to the same places, I'd never discover spots like that.
          phrases: [I'd definitely choose, isn't just about ~; it's also about, For instance, turned out to be]
    tip_ko: 7번은 둘 중 하나를 고르는 질문이에요. 첫 문장에서 분명히 고르고, 이유 두 개나 이유 하나 + 짧은 경험으로 30초를 채워요.
  - num: 8
    type: info_based
    caller_intro: >-
      Hi, this is Daniel Park. I'm leaving for my business trip to Toronto soon, but I can't find my itinerary. Could you answer a few
      questions for me?
    info:
      title: "Business Trip Itinerary — Daniel Park"
      subtitle: "Sales Department · Toronto · April 8–10"
      rows:
        - ["Apr 8, 8:15 a.m.", "Flight 207 departs Seattle (arrives Toronto 3:40 p.m.)"]
        - ["Apr 8, 5:00 p.m.", "Check in: Lakeview Hotel (2 nights)"]
        - ["Apr 9, 9:30 a.m.", "Meeting with Harbor Supplies — Conference Room A"]
        - ["Apr 9, 12:30 p.m.", "Lunch with regional sales managers"]
        - ["Apr 9, 3:00 p.m.", "Factory tour — Westside Plant"]
        - ["Apr 10, 10:00 a.m.", "Product presentation — Toronto office"]
        - ["Apr 10, 4:20 p.m.", "Flight 318 departs Toronto (arrives Seattle 6:55 p.m.)"]
    question: What time does my flight leave on April 8, and when does it arrive in Toronto?
    model:
      lv5:
        - text: Your flight leaves at 8:15 a.m. on April 8. It arrives in Toronto at 3:40 p.m.
        - text: Flight 207 leaves Seattle at 8:15 in the morning. You arrive at 3:40 p.m.
      lv6:
        - text: Your flight, Flight 207, leaves Seattle at 8:15 a.m. on April 8. It arrives in Toronto at 3:40 in the afternoon.
        - text: On April 8, your flight departs at 8:15 in the morning, and you will arrive in Toronto at 3:40 p.m.
      lv7:
        - text: >-
            Sure. You're on Flight 207, which leaves Seattle at 8:15 a.m. on April 8. It arrives in Toronto at 3:40 p.m., so you'll have
            time to check in.
        - text: >-
            Of course. Your flight departs from Seattle at 8:15 in the morning on April 8, and it's scheduled to arrive in Toronto at 3:40
            in the afternoon.
      lv8:
        - text: >-
            Sure, I can help with that. You're booked on Flight 207, which departs from Seattle at 8:15 a.m. on April 8. It's scheduled to
            land in Toronto at 3:40 p.m., so you'll have plenty of time before hotel check-in.
        - text: >-
            Of course. Your flight on April 8 is Flight 207. It leaves Seattle at 8:15 in the morning and arrives in Toronto at 3:40 in the
            afternoon. After that, you can head straight to your hotel.
    tip_ko: 출발과 도착, 두 가지를 묻고 있어요. 자료 첫 줄에서 시간 두 개를 정확히 읽어 주면 돼요.
  - num: 9
    type: info_based
    question: I believe I'm staying at the hotel for three nights. Is that correct?
    model:
      lv5:
        - text: No, you are staying for two nights. You check in on April 8.
        - text: Sorry, that's not right. You stay at the Lakeview Hotel for two nights.
      lv6:
        - text: I'm sorry, but that's not correct. You are staying at the Lakeview Hotel for two nights, from April 8 to April 10.
        - text: Actually, no. You check in at the Lakeview Hotel on April 8 at 5 p.m., and you stay there for two nights.
      lv7:
        - text: >-
            Actually, that's not quite right. You'll be staying at the Lakeview Hotel for only two nights. You check in on April 8, and you
            fly back on April 10.
        - text: >-
            I'm afraid there's a mistake. Your reservation at the Lakeview Hotel is for two nights, not three. Check-in is at 5 p.m. on
            April 8.
          phrases: [I'm afraid there's a mistake]
      lv8:
        - text: >-
            I'm afraid that's not quite right. You're booked at the Lakeview Hotel for two nights, not three. You check in at 5 p.m. on
            April 8, and your return flight leaves on the afternoon of April 10.
          phrases: [I'm afraid that's not quite right]
        - text: >-
            Actually, it's only two nights. You'll check in at the Lakeview Hotel at 5 p.m. on April 8 and check out on April 10, since
            your flight back to Seattle leaves at 4:20 that afternoon.
    tip_ko: 9번은 틀린 정보를 바로잡는 문제예요. "Actually, no" 같은 말로 먼저 아니라고 하고, 맞는 숫자(two nights)를 알려 줘요.
