items:
  - num: 1
    type: read_aloud
    text: >-
      Attention, passengers on Flight 482 to Lisbon. Due to a mechanical inspection, this flight has been delayed by about forty minutes.
      The new boarding time is ten fifteen, and the flight will now depart from Gate 21 instead of Gate 17. Please keep your boarding pass,
      passport, and carry-on bags ready. We apologize for the inconvenience and thank you for your patience.
    marks: >-
      Attention, / passengers on Flight four eighty-**two** / to **Lis**bon. // Due to a mechanical in**spec**tion, / this flight has been
      de**layed** / by about forty **min**utes. // The new boarding time / is ten fif**teen**, / and the flight will now depart / from Gate
      twenty-**one** / instead of Gate seven**teen**. // Please keep your boarding **pass**, ↗ / **pass**port, ↗ / and carry-on **bags** ↘ /
      ready. // We apologize for the incon**ven**ience / and thank you for your **pa**tience.
    tip_ko: 편명·시간·게이트 번호가 핵심 정보예요. 숫자는 한 덩어리로 또박또박 읽고, 바뀐 게이트(21)를 조금 힘주어 말해요.
  - num: 2
    type: read_aloud
    text: >-
      Good evening, and welcome to City Talk. I'm your host, Laura Bennett. On tonight's show, we'll meet a young chef who opened a
      restaurant at the age of twenty-two, a local musician who teaches free guitar lessons, and a scientist who studies the birds in our
      city parks. Later, we'll answer your questions about this weekend's weather. Stay with us!
    marks: >-
      Good **eve**ning, / and welcome to City **Talk**. // I'm your **host**, / Laura **Ben**nett. // On tonight's **show**, / we'll meet a
      young **chef** / who opened a restaurant / at the age of twenty-**two**, ↗ / a local mu**si**cian / who teaches free guitar
      **les**sons, ↗ / and a **sci**entist / who studies the birds / in our city **parks**. ↘ // **La**ter, / we'll answer your questions /
      about this weekend's **wea**ther. // Stay with **us**!
    tip_ko: 손님 세 명을 소개하는 나열이에요. 사람마다 설명이 길어서, 사람 단위로 끊고 앞 두 명은 올려 읽고 마지막은 내려 읽어요.
  - num: 3
    type: describe_photo
    image: img/toeic/set03_q3.svg
    credit: placeholder-set03-q3
    model:
      lv5:
        - text: This is a picture of a café. A man is making coffee. A woman is paying with a card. There is a menu on the wall.
          phrases: [This is a picture of, There is]
        - text: This picture shows a coffee shop. On the left, a man is working at a coffee machine. On the right, a woman is buying something.
          phrases: [This picture shows, On the left, On the right]
      lv6:
        - text: >-
            This picture was taken in a café. On the left, a man in a black apron is making coffee with a machine. In the middle,
            there are some pastries in a glass case. On the right, a woman is paying with a card.
          phrases: [This picture was taken in, On the left, In the middle, On the right]
        - text: >-
            This is a picture of a small coffee shop. A barista is standing behind the counter and using an espresso machine. A woman
            in a blue top is paying at the counter. Above them, there is a menu board.
          phrases: [This is a picture of, standing behind, Above them]
      lv7:
        - text: >-
            This picture was taken at the counter of a small café. On the left, a barista wearing a green headband is making coffee at
            an espresso machine. In front of him, there's a glass case full of pastries. On the right, a woman with a purple bag is
            paying with her card. It seems like she just ordered a drink.
          phrases: [wearing, In front of him, It seems like]
        - text: >-
            The first thing I see is a café counter with a big menu board on the wall. A barista in a white shirt and a black apron is
            busy preparing a drink. Next to the machine, some pastries are displayed in a glass case. A customer is tapping her card on
            the card reader to pay.
          phrases: [The first thing I see is, busy preparing, Next to]
      lv8:
        - text: >-
            This picture shows a cozy café, probably during a quiet moment of the day. On the left, a barista in a green headband and a
            black apron is preparing a drink at a silver espresso machine. Right next to him, there's a glass display case filled with
            pastries. On the other side of the counter, a woman with reddish-brown hair is paying by card, so I guess she's waiting for
            her order.
          phrases: [This picture shows, probably, Right next to him, On the other side of, so I guess]
        - text: >-
            What stands out in this picture is a café counter under a large chalkboard menu. Behind the counter, a barista is focused on
            making coffee with an espresso machine, while a customer in a blue top is paying for her order with a card. There are a few
            pastries in a display case between them, and two lamps hanging from the ceiling give the place a warm feeling.
          phrases: [What stands out in this picture is, is focused on, while, give the place a ~ feeling]
    tip_ko: 사람이 둘이면 왼쪽 인물 → 가운데 사물 → 오른쪽 인물 순서로 옮겨 가요. 옷차림이나 소지품을 붙이면 문장이 자연스럽게 길어져요.
  - num: 4
    type: describe_photo
    image: img/toeic/set03_q4.svg
    credit: placeholder-set03-q4
    model:
      lv5:
        - text: This is a picture of a park. A woman is walking a dog. A man is running. Two people are sitting on a bench.
          phrases: [This is a picture of]
