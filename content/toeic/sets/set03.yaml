  - num: 11
    type: opinion
    question: >-
      Which is a better way to learn a new skill: watching online videos or taking an in-person class? Give specific reasons and
      examples to support your opinion.
    model:
      lv5:
        - text: >-
            I think taking an in-person class is better. I have two reasons. First, I can ask the teacher questions. Second, I can meet
            other students. For example, I took a cooking class last year. The teacher helped me a lot. So I prefer in-person classes.
          phrases: [I have two reasons, First, Second, For example]
        - text: >-
            I think online videos are better. First, they are free. I don't need to pay money. Second, I can watch them anytime. For
            example, I learned to play the guitar with videos at night. It was easy. I watched them every day after dinner. So I like online videos.
          phrases: [First, Second, For example]
      lv6:
        - text: >-
            I think taking an in-person class is a better way to learn a new skill. There are two reasons. First, the teacher can check
            my mistakes right away. Second, I can stay motivated because I study with other people. I don't want to miss class. For example, last year I took a
            swimming class at a sports center. The coach fixed my arm movements every week, so I improved very quickly. These days, I swim twice a week. For these reasons,
            I prefer in-person classes.
          phrases: [There are two reasons, For example, For these reasons]
        - text: >-
            In my opinion, watching online videos is a better way to learn a new skill. First, there are many free videos, so it's
            cheaper than a class. Second, I can learn at my own speed. If I don't understand something, I can watch it again. I can also stop and practice. For
            example, I learned how to edit photos by watching videos after work. It saved me a lot of time and money. So I think online videos are better.
          phrases: [In my opinion, at my own speed, For example]
      lv7:
        - text: >-
            I believe taking an in-person class is a better way to learn a new skill. The biggest reason is that you can get feedback
            right away. When you watch a video, nobody tells you what you're doing wrong. For example, I tried to learn yoga from online
            videos last year, but I hurt my back because my posture was wrong. After I joined a class at a local studio, the instructor
            corrected my form, and I made much better progress. Also, studying with other people keeps me motivated, because I don't want to fall behind the others. Therefore, I
            strongly prefer in-person classes for learning new skills.
          phrases: [The biggest reason is that, For example, After I, Also, Therefore]
        - text: >-
            I think watching online videos is a better way to learn a new skill. First, it's much more flexible. I work full-time, so it's
            hard for me to attend a class at a fixed time every week. With videos, I can learn whenever I have free time, like late at night or on weekends. Second, there's
            a huge variety of content. For example, when I wanted to learn basic coding, I found dozens of tutorials for beginners, and I
            could choose the teacher I liked best. Thanks to those videos, I built my own simple website in two months. For these reasons, I prefer learning with online videos.
          phrases: [it's much more flexible, With videos, a huge variety of, For these reasons]
      lv8:
        - text: >-
            Personally, I think taking an in-person class is the better option, especially for skills that involve your body, like sports or
            cooking. The main reason is that a real teacher can notice small mistakes that you can't see yourself. I learned this when I
            started taking tennis lessons last spring. I had watched a lot of videos before that, but the coach pointed out in the very first
            lesson that I was holding the racket the wrong way. Fixing that one habit improved my game more than months of watching videos.
            On top of that, having a set schedule makes it much harder to give up. When I'm tired, I still go to my lesson because I've already paid for it and my coach is waiting.
            So overall, I'd recommend an in-person class to anyone who wants to learn a practical skill properly.
          phrases: [the better option, especially for, I learned this when, On top of that, So overall]
        - text: >-
            In my opinion, online videos are a better way to learn most new skills these days. The biggest advantage is that you can learn at
            your own pace. In a class, the teacher has to move at the speed of the whole group, but with a video, you can pause, rewind, and
            practice a difficult part as many times as you need. For instance, I taught myself how to use a spreadsheet program for work by
            watching short tutorials during my commute. Within a month, I was building reports that used to take my coworkers hours. It also saved me money, because I didn't have to pay for an expensive course. Of
            course, classes have their benefits, like meeting other learners, but for busy people, videos are simply more practical
            and much easier to fit into a daily routine.
          phrases: [The biggest advantage is that, at your own pace, For instance, Of course ~ but]
    tip_ko: 첫 문장에서 한쪽을 분명히 고르고, 이유 하나에 직접 해 본 경험을 붙여요. 반대쪽 장점을 한 문장 인정하면 답이 더 설득력 있어 보여요.
