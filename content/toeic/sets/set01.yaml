    tip_ko: 날짜와 장소, 질문이 두 개예요. 자료 맨 위 줄에서 바로 찾아 읽으면 돼요.
  - num: 9
    type: info_based
    question: I heard that lunch is included in the registration fee. Is that right?
    model:
      lv5:
        - text: Sorry, lunch is not included. You have lunch on your own from 12 to 1.
        - text: >-
            No, lunch is not included. The fee is 40 dollars. You need to buy your own lunch.
      lv6:
        - text: I'm sorry, but lunch is not included in the 40-dollar fee. You need to have lunch on your own from 12 to 1.
        - text: >-
            Sorry, that's not correct. The registration fee is 40 dollars, but lunch is not included. Lunch is on your own from 12
            to 1.
          phrases: ['Sorry, that''s not correct.']
      lv7:
        - text: >-
            Actually, no. The registration fee is 40 dollars, but it doesn't include lunch. The lunch break is from 12 to 1,
            and you'll need to eat on your own.
          phrases: ['Actually, no.']
        - text: >-
            I'm sorry, but that's not correct. Lunch isn't included in the 40-dollar fee. There's a lunch break from 12 to 1, so
            you'll need to buy your own lunch.
          phrases: ['I''m sorry, but that''s not correct.']
      lv8:
        - text: >-
            I'm afraid that's not quite right. The 40-dollar registration fee covers all the sessions and the morning coffee, but lunch
            isn't included. There's an hour-long break from noon to 1 p.m., so you'll need to find lunch on your own.
          phrases: [I'm afraid that's not quite right]
        - text: >-
            Actually, I'm afraid you've been given the wrong information. Your 40-dollar fee only covers registration, coffee, and
            the sessions. Lunch is on your own from noon to 1 p.m., so you might want to bring something or eat nearby.
          phrases: [you've been given the wrong information, only covers, you might want to]
    tip_ko: 9번은 보통 잘못 알고 있는 정보를 물어요. "아니에요"를 먼저 말하고 맞는 정보를 알려 줘요.
