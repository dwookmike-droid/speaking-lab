        - text: >-
            I can see a meeting room. A man and a woman are sitting at a table. The man is holding a cup. There is a big window.
          phrases: [I can see]
      lv6:
        - text: >-
            This picture was taken in an office. In the middle of the picture, two people are having a meeting at a table.
            The woman on the left is looking at a laptop. In the background, there is a whiteboard with a chart. They look busy.
          phrases: [This picture was taken in, In the middle of the picture, In the background, They look]
        - text: >-
            This is a picture of two coworkers in a meeting room. On the left, a woman is working on her laptop. Next to her, a man
            is holding a coffee cup. There is a big window on the right side of the room.
          phrases: [On the left, Next to her]
      lv7:
        - text: >-
            This picture was taken in a bright meeting room. The first thing I see is two coworkers sitting next to each other at a table.
            The woman is typing something on her laptop, and the man is holding a cup of coffee. Behind them, there is a whiteboard
