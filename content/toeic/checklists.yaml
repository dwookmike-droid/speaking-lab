# 결과 화면의 스스로 점검표. 유형마다 4~5개.
schema_version: 1
read_aloud:
  - 끊어 읽기 표시(/, //)에서 쉬었어요
  - 이름·숫자·고유명사를 막히지 않고 읽었어요
  - 나열(A, B, and C)을 올렸다 내리는 억양으로 읽었어요
  - 시간 안에 끝까지 읽었어요
describe_photo:
  - 장소를 먼저 말했어요
  - 가운데 인물의 동작을 현재진행형으로 말했어요
  - 주변 사물이나 배경을 하나 이상 말했어요
  - 느낌이나 추측 한 문장으로 마무리했어요
  - 30초를 거의 다 채웠어요
respond_q:
  - 질문의 첫 문장을 그대로 받아 답을 시작했어요
  - 질문에 나온 내용(빈도·사람·이유)을 빠짐없이 답했어요
  - 7번은 의견 + 이유 두 개를 말했어요
  - 시간이 끝나기 전에 문장을 마쳤어요
info_based:
  - 자료의 숫자·시간·이름을 정확히 말했어요
  - 틀린 정보를 묻는 질문에서 먼저 바로잡았어요
  - 10번은 항목 두 개 이상을 시간 순서대로 말했어요
  - 전화 응대 말투(Sure, I'm afraid…)를 썼어요
opinion:
  - 첫 문장에 찬반을 분명히 말했어요
  - 이유 두 개를 First, Second로 나눴어요
  - 이유 하나에 구체적인 경험 예시를 붙였어요
  - 마지막에 의견을 한 번 더 말했어요
  - 60초를 거의 다 채웠어요
