# 목표 레벨별 모범답변 작성 기준. 학생이 고른 목표 레벨에 맞는 답변을 보여 줘요.
# 단어 수는 이 앱의 작성 기준(답변 시간 × 레벨별 말 속도·밀도)이고 공식 채점 기준이 아니에요. 써 보면서 조정해요.
# variants_min: 레벨마다 최소 몇 가지 답변을 쓸지 (같은 문항, 다른 내용·표현)

toeic:
  levels: [lv5, lv6, lv7, lv8]          # 학생이 고를 수 있는 목표 레벨
  labels:
    lv5: {name: "Level 5", score: "110–120"}
    lv6: {name: "Level 6", score: "130–150"}
    lv7: {name: "Level 7", score: "160–180"}
    lv8: {name: "Level 8", score: "190–200"}
  variants_min: 2
  style_ko:
    lv5: 짧은 현재형 문장. 외운 뼈대 그대로, 이유 하나.
    lv6: 뼈대 + 이유 둘. and/because/so 정도의 연결.
    lv7: 이유마다 짧은 예시. 시제·비교급 섞기, 연결어 다양하게.
    lv8: 구체적인 경험 예시, 관계절·조건문, 자연스러운 마무리 문장.
  words:                                # 유형(+답변 초) → 레벨별 [최소, 최대] 단어 수
    describe_photo_30: {lv5: [20, 35], lv6: [35, 50], lv7: [50, 65], lv8: [60, 85]}
    respond_q_15:      {lv5: [10, 20], lv6: [18, 28], lv7: [25, 35], lv8: [30, 45]}
    respond_q_30:      {lv5: [20, 35], lv6: [35, 50], lv7: [50, 65], lv8: [60, 85]}
    info_based_15:     {lv5: [10, 20], lv6: [15, 25], lv7: [20, 32], lv8: [25, 40]}
    info_based_30:     {lv5: [20, 35], lv6: [30, 45], lv7: [40, 60], lv8: [50, 75]}
    opinion_60:        {lv5: [45, 70], lv6: [75, 100], lv7: [100, 130], lv8: [130, 165]}

opic:
  levels: [il, im1, im2, im3, ih, al]
  labels:
    il:  {name: "IL"}
    im1: {name: "IM1"}
    im2: {name: "IM2"}
    im3: {name: "IM3"}
    ih:  {name: "IH"}
    al:  {name: "AL"}
  variants_min: 2
  style_ko:
    il:  외운 문장 몇 개를 나열. 현재형 위주, 짧은 단문.
    im1: 단문을 이어 문단 비슷하게. 현재·과거를 구분해서 써요.
    im2: 도입 → 내용 → 마무리 흐름. 이유와 간단한 예시.
    im3: 문단 단위로 말하기. 시제 바꿔 가며 경험 이야기, 감정 표현.
    ih:  경험을 시간 순서로 구체적으로. 비교, 바뀐 점, 돌발 상황 대처.
    al:  긴 문단을 막힘없이. 다양한 시제·가정, 의견과 근거를 길게.
  words:                                # 유형 → 레벨별 [최소, 최대] 단어 수
    default:        {il: [30, 60], im1: [60, 90], im2: [90, 120], im3: [110, 145], ih: [140, 185], al: [170, 230]}
    roleplay_ask:   {il: [20, 40], im1: [35, 55], im2: [50, 75], im3: [65, 90], ih: [80, 110], al: [95, 130]}
