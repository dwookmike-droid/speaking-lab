# 시험별 문항 구성·시간(초). 모의테스트 엔진은 이 파일만 기준으로 써요.
toeic:
  name: TOEIC Speaking
  total_items: 11
  parts:
    - {type: read_aloud,     items: [1, 2],     prep: 45, speak: [45, 45]}
    - {type: describe_photo, items: [3, 4],     prep: 45, speak: [30, 30]}
    - {type: respond_q,      items: [5, 6, 7],  prep: 3,  speak: [15, 15, 30]}
    - {type: info_based,     items: [8, 9, 10], read: 45, prep: 3, speak: [15, 15, 30], repeat_last: 2}   # 마지막 질문은 두 번 들려줘요
    - {type: opinion,        items: [11],       prep: 45, speak: [60]}
  score: {min: 0, max: 200, levels: 8}
opic:
  name: OPIc
  total_minutes: 40          # 본 시험(설문·자가평가 뒤)부터 재요
  replay_per_item: 1         # 질문 다시 듣기 1번
  recommended_speak: [60, 120]
  max_speak: 180             # 한 답변 최대 녹음 길이(초). 넘으면 다음 문항으로
  self_assessment_levels: 6
  readjust_after: 7          # 7번 뒤 난이도 다시 고르기
  readjust_options: {easier: -1, same: 0, harder: 1}
  survey_min_topics: 4       # 설문에서 고를 최소 주제 수(실제 시험은 12개 항목, 이 앱은 주제 단위로 줄였어요)
  item_types: [self_intro, description, routine, past_experience, comparison, issue, roleplay_ask, roleplay_solve, roleplay_experience]
  topic_kinds:               # 주제 파일 종류별로 꼭 있어야 하는 문항 유형
    self_intro: [self_intro]
    survey: [description, routine, past_experience, comparison]
    unexpected: [description, routine, past_experience, comparison, issue]
    roleplay: [roleplay_ask, roleplay_solve, roleplay_experience]
  # 시험 구성: 자가평가 난이도(1~6)에 따라 고르고, 7번 뒤 재조정한 난이도(d)는 8번부터 적용해요.
  #   survey_combo: 설문 주제 하나에서 description → routine → past_experience
  #   unexpected_combo: 돌발 주제 하나에서 같은 순서 (low는 앞의 2문항만)
  #   roleplay: 롤플레이 하나에서 ask → solve → experience (low는 ask → solve)
  #   final: d가 4 이상이면 comparison(설문 주제) + issue(돌발 주제), 아니면 다른 설문 주제의 routine + past_experience
  blueprint:
    low:  {levels: [1, 2], slots: [self_intro, survey_combo, survey_combo, unexpected_combo_short, roleplay_short]}          # 12문항
    mid:  {levels: [3, 4], slots: [self_intro, survey_combo, survey_combo, unexpected_combo, roleplay, final]}              # 15문항
    high: {levels: [5, 6], slots: [self_intro, survey_combo, survey_combo, unexpected_combo, roleplay, final]}              # 15문항
  grades: [NL, NM, NH, IL, IM1, IM2, IM3, IH, AL]
