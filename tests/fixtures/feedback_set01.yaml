# 테스트용 예시 피드백: tests/fixtures/student_set01.yaml(가상 학생)에 speaking-feedback 스킬로 쓴 결과예요. __ATTEMPT__는 테스트가 바꿔 넣어요.
schema_version: 1
student_id: S001
attempt_id: __ATTEMPT__
set_id: toeic-set01
target: lv7
overall:
  est_level: lv6
  summary_ko: >-
    질문마다 바로 답을 시작하고, 자료 문제에서 숫자와 시간을 정확히 읽었어요. 목표 Lv7과의 차이는 관사(a, the)와
    복수형 -s가 자주 빠지는 것, 그리고 30초·60초 문항에서 시간이 남는데 말을 일찍 멈추는 것이에요.
  strengths_ko:
    - 질문 두 개를 묻는 문항(Q5, Q8)에서 두 가지를 모두 답했어요.
    - 의견 문항에서 First, Second, For example 순서로 구성을 지켰어요.
  priorities_ko:
    - 명사 앞 관사와 복수형 -s 챙기기 (a office → an office, many apple → many apples)
    - Q7·Q10·Q11에서 이유나 항목을 하나 더 붙여 남는 시간 채우기 (Q11은 17초가 남았어요)
    - 문장 사이 "um, uh" 줄이기 — 다음 문장 첫 단어를 먼저 정하고 말을 시작해요
items:
  - num: 1
    good_ko:
      - 고유명사(Greenfield Science Museum)를 막히지 않고 읽었고, 멈춘 곳 없이 끝까지 읽었어요.
    fixes:
      - said: "review a few guideline"
        better: "review a few guidelines"
        why_ko: 지문의 복수형 -s를 빠뜨렸어요. 이 지문에서 같은 실수가 네 번 나왔어요(hall, guide, question).
      - said: "audio guide are available"
        better: "audio guides are available"
        why_ko: 주어가 복수라 are가 붙어요. -s를 빼면 듣는 사람에게 문법이 틀린 문장으로 들려요.
    next_ko: 읽기 전 준비 시간에 -s로 끝나는 명사에 밑줄을 긋고, 그 단어만 또박또박 읽는 연습을 해 보세요.
    pronunciation: check
  - num: 2
    good_ko:
      - 첫 문장 질문을 올려 읽는 억양이 자연스러웠고, 숫자(ten percent, seven, ten)를 정확히 읽었어요.
    fixes:
      - said: "until ten at night, um, seven days a week"
        better: "until ten at night, seven days a week"
        why_ko: 지문 읽기에서는 군말이 감점 요인이에요. 쉼표에서 숨만 쉬고 바로 이어 읽어요.
    next_ko: 문장이 길게 이어지는 부분은 미리 / 표시를 해 두고 그 자리에서만 쉬어 보세요.
    pronunciation: check
  - num: 3
    est_level: lv6
    good_ko:
      - 장소 → 왼쪽 인물 → 다른 인물 → 배경 순서로 빠짐없이 묘사했어요.
    fixes:
      - said: "this picture was taken in a office"
        better: "This picture was taken in an office."
        why_ko: office처럼 모음 소리로 시작하는 단어 앞에는 an을 써요.
      - said: "Two people is sitting at the table"
        better: "Two people are sitting at a round table."
        why_ko: people은 복수라 are예요. round 같은 형용사를 하나 붙이면 묘사가 더 구체적이에요.
      - said: "a whiteboard with chart"
        better: "a whiteboard with a bar chart on it"
        why_ko: 셀 수 있는 명사 앞에는 a가 필요해요.
    next_ko: 마지막 문장을 "It seems like they are preparing for a meeting."처럼 추측 문장으로 바꿔 Lv7 표현을 하나 넣어 보세요.
    pronunciation: check
  - num: 4
    est_level: lv5
    good_ko:
      - 오른쪽 인물과 하는 일(selling)을 먼저 말해서 사진의 중심을 잘 잡았어요.
    fixes:
      - said: "there are many apple and orange in the boxes"
        better: "there are many apples and oranges in the boxes"
        why_ko: many 뒤에는 복수형이 와요.
      - said: "it is sunny day"
        better: "It looks like a sunny day."
        why_ko: day 앞에 a가 필요하고, It looks like로 바꾸면 추측 표현이 돼요.
      - said: "a man is selling fruits"
        better: "a man in a green apron is selling fruit"
        why_ko: fruit은 보통 셀 수 없는 명사로 써요. 옷차림을 붙이면 문장이 길어지고 구체적이에요.
    next_ko: 사람마다 옷차림(in a green apron, with a shopping bag) 하나씩을 붙여서 35단어를 50단어 이상으로 늘려 보세요.
    pronunciation: check
  - num: 5
    est_level: lv6
    good_ko:
      - 얼마나 자주, 누구와 — 두 질문에 모두 답했어요.
    fixes:
      - said: "two times in a week"
        better: "twice a week"
        why_ko: 빈도는 in 없이 twice a week, three times a week로 말해요.
    next_ko: 15초가 남지 않도록 이유 한 마디(because we both like walking)를 붙여 보세요.
    pronunciation: check
  - num: 6
    est_level: lv5
    good_ko:
      - 계절을 고르고 이유를 두 가지(날씨, 꽃) 말했어요.
    fixes:
      - said: "spring is best time"
        better: "spring is the best time to visit a park in my area"
        why_ko: best 앞에는 the가 필요해요. 질문 문장을 그대로 받아 말하면 답이 길어지고 안정적이에요.
    next_ko: '"The best time to visit a park in my area is ~"로 시작하는 연습을 세 번 해 보세요.'
    pronunciation: check
  - num: 7
    est_level: lv6
    good_ko:
      - 첫 문장에서 선택을 분명히 하고, 이유를 First, Second로 나눴어요.
    fixes:
      - said: "I don't need to use bus"
        better: "I don't need to take a bus to get there"
        why_ko: 교통수단은 take a bus로 말하고, a를 빼지 않아요.
      - said: "so I think small park is better for me"
        better: "so I think a small park near my home is better for me"
        why_ko: small park 앞에 a가 빠졌어요.
    next_ko: 이유 하나에 짧은 예시(For example, I go there after dinner every day.)를 붙여 30초를 채워 보세요.
    pronunciation: check
  - num: 8
    est_level: lv6
    good_ko:
      - 날짜와 장소를 자료와 똑같이 정확하게 말했어요.
    fixes:
      - said: "it will be held at City Convention Center, Hall B"
        better: "it will be held in Hall B of the City Convention Center"
        why_ko: 건물 이름 앞에는 the를 붙여요. 작은 장소(Hall B)를 먼저 말하면 더 자연스러워요.
    next_ko: 시작 시간(9 a.m.)까지 한 문장 더 붙이면 Lv7 답변이 돼요.
    pronunciation: check
  - num: 9
    est_level: lv5
    good_ko:
      - 틀린 정보를 먼저 바로잡고 맞는 시간을 알려 줬어요.
    fixes:
      - said: "Um, sorry, lunch is not included"
        better: "I'm sorry, but lunch isn't included in the 40-dollar registration fee."
        why_ko: 질문에 나온 등록비(40달러)를 같이 말하면 답이 더 정확하고 길어져요.
    next_ko: 9번은 "I'm afraid that's not correct."로 시작하는 연습을 해 보세요. 군말 없이 첫 문장을 시작할 수 있어요.
    pronunciation: check
  - num: 10
    est_level: lv6
    good_ko:
      - 오후 일정 세 개를 시간 순서대로 빠짐없이 말했어요.
    fixes:
      - said: "workshop, Effective Presentation by Sarah Kim"
        better: "Sarah Kim will lead a workshop called Effective Presentations"
        why_ko: 행사 이름은 자료 그대로(Presentations) 읽고, 진행자를 주어로 문장을 만들면 더 매끄러워요.
      - said: "closing remarks is at 3:30"
        better: "the conference finishes with closing remarks at 3:30"
        why_ko: remarks는 복수라 is가 맞지 않아요. 동사를 바꾸면 수 일치를 피할 수 있어요.
    next_ko: 항목 사이를 First, After that, Finally로 이어서 말해 보세요.
    pronunciation: check
  - num: 11
    est_level: lv6
    good_ko:
      - 의견 → 이유 두 개 → 경험 예시 → 마무리 구성을 지켰어요.
      - 카페 아르바이트 경험이 구체적이라 설득력이 있었어요.
    fixes:
      - said: "they can get a experience"
        better: "they can get real work experience"
        why_ko: 경험 전반을 말할 때 experience는 셀 수 없는 명사라 a를 붙이지 않아요.
      - said: "It was very helpful when I get a job"
        better: "It helped me a lot when I got my first job"
        why_ko: 지난 일이라 got으로 시제를 맞춰요.
      - said: "they can earn money for living"
        better: "they can earn money for their living costs"
        why_ko: for living만 쓰면 뜻이 흐려져요. living costs처럼 명사로 분명히 말해요.
    next_ko: 예시 뒤에 "This experience taught me ~" 한 문장을 더 붙여 남은 17초를 채워 보세요. 예시 앞의 긴 멈춤(2초)도 줄여 보세요.
    pronunciation: check
