<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A barista making coffee and a customer paying at a cafe counter">
  <rect width="800" height="600" fill="#f2e9dc"/>
  <!-- menu board -->
  <rect x="250" y="40" width="300" height="150" rx="6" fill="#2b2b2b" stroke="#7a5638" stroke-width="10"/>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#f2e9dc">MENU</text>
  <g stroke="#cfc6b8" stroke-width="3"><line x1="280" y1="105" x2="460" y2="105"/><line x1="490" y1="105" x2="520" y2="105"/><line x1="280" y1="130" x2="440" y2="130"/><line x1="490" y1="130" x2="520" y2="130"/><line x1="280" y1="155" x2="450" y2="155"/><line x1="490" y1="155" x2="520" y2="155"/></g>
  <!-- hanging lights -->
  <line x1="120" y1="0" x2="120" y2="60" stroke="#444" stroke-width="2"/><path d="M95 60 h50 l-10 25 h-30z" fill="#e0b84b"/>
  <line x1="680" y1="0" x2="680" y2="60" stroke="#444" stroke-width="2"/><path d="M655 60 h50 l-10 25 h-30z" fill="#e0b84b"/>
  <!-- barista (left, behind counter) -->
  <rect x="120" y="250" width="100" height="160" rx="30" fill="#f6f6f6"/>
  <rect x="140" y="270" width="60" height="140" rx="10" fill="#2f2f2f"/>
  <circle cx="170" cy="215" r="34" fill="#d9a77f"/>
  <path d="M136 210 q34 -50 68 0 q-4 -36 -34 -36 q-30 0 -34 36z" fill="#3b2a20"/>
  <rect x="134" y="190" width="72" height="14" rx="6" fill="#3c8d4f"/>
  <!-- espresso machine -->
  <rect x="230" y="260" width="130" height="120" rx="8" fill="#b9bec4"/>
  <rect x="245" y="275" width="100" height="30" fill="#8d949b"/>
  <rect x="270" y="305" width="12" height="25" fill="#555"/><rect x="310" y="305" width="12" height="25" fill="#555"/>
  <rect x="265" y="345" width="22" height="30" fill="#fff" stroke="#777" stroke-width="2"/>
  <path d="M220 300 q20 10 30 20" stroke="#d9a77f" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- counter -->
  <rect y="380" width="800" height="40" fill="#7a5638"/>
  <rect y="420" width="800" height="180" fill="#9a6b3f"/>
  <!-- pastry display -->
  <rect x="380" y="330" width="170" height="52" fill="#dfeef3" stroke="#888" stroke-width="3" opacity=".9"/>
  <g fill="#d9a05b"><ellipse cx="410" cy="365" rx="18" ry="10"/><ellipse cx="450" cy="365" rx="18" ry="10"/><ellipse cx="490" cy="365" rx="18" ry="10"/><ellipse cx="525" cy="365" rx="14" ry="10"/></g>
  <!-- card reader + customer (right, paying) -->
  <rect x="580" y="350" width="40" height="32" rx="4" fill="#333"/><rect x="586" y="356" width="28" height="12" fill="#7fd1a8"/>
  <rect x="640" y="250" width="100" height="170" rx="30" fill="#4f7cc4"/>
  <circle cx="690" cy="215" r="34" fill="#f0c9a5"/>
  <path d="M656 218 q34 -64 68 0 l4 50 q-12 -56 -38 -62 q-26 6 -38 62z" fill="#a0522d"/>
  <path d="M650 300 q-20 30 -32 50" stroke="#4f7cc4" stroke-width="18" fill="none" stroke-linecap="round"/>
  <rect x="604" y="338" width="26" height="16" rx="2" fill="#e0b84b"/>
  <rect x="742" y="300" width="36" height="60" rx="6" fill="#8a6d9c"/>
  <text x="790" y="590" text-anchor="end" font-family="sans-serif" font-size="14" fill="#f2e9dc">illustration placeholder</text>
</svg>
