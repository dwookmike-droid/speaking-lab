<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Two coworkers at a round table in a meeting room">
  <rect width="800" height="600" fill="#e9e4da"/>
  <rect y="430" width="800" height="170" fill="#b9a68c"/>
  <!-- window -->
  <rect x="520" y="60" width="240" height="300" fill="#bfe0f2" stroke="#8a7a66" stroke-width="10"/>
  <line x1="640" y1="60" x2="640" y2="360" stroke="#8a7a66" stroke-width="8"/>
  <line x1="520" y1="210" x2="760" y2="210" stroke="#8a7a66" stroke-width="8"/>
  <!-- whiteboard with bar chart -->
  <rect x="90" y="70" width="330" height="200" rx="6" fill="#fff" stroke="#9a9a9a" stroke-width="6"/>
  <line x1="120" y1="240" x2="390" y2="240" stroke="#555" stroke-width="3"/>
  <line x1="120" y1="240" x2="120" y2="100" stroke="#555" stroke-width="3"/>
  <rect x="145" y="190" width="40" height="50" fill="#4f7cc4"/>
  <rect x="205" y="160" width="40" height="80" fill="#4f7cc4"/>
  <rect x="265" y="130" width="40" height="110" fill="#4f7cc4"/>
  <rect x="325" y="110" width="40" height="130" fill="#e07a4b"/>
  <!-- woman (left) -->
  <rect x="235" y="330" width="90" height="120" rx="30" fill="#c0504d"/>
  <circle cx="280" cy="300" r="34" fill="#f0c9a5"/>
  <path d="M246 296 q34 -60 68 0 q-6 -40 -34 -42 q-28 2 -34 42z" fill="#3b2a20"/>
  <!-- man (right) -->
  <rect x="425" y="330" width="90" height="120" rx="30" fill="#3f6fa6"/>
  <circle cx="470" cy="300" r="34" fill="#d9a77f"/>
  <path d="M438 292 q32 -40 64 0 q-4 -30 -32 -30 q-28 0 -32 30z" fill="#222"/>
  <rect x="404" y="368" width="26" height="30" rx="4" fill="#fff" stroke="#777" stroke-width="3"/>
  <!-- round table + laptop -->
  <ellipse cx="380" cy="455" rx="230" ry="45" fill="#7a5638"/>
  <rect x="370" y="490" width="20" height="90" fill="#5d4029"/>
  <rect x="240" y="388" width="110" height="62" rx="4" fill="#3a3a3a"/>
  <rect x="226" y="446" width="138" height="10" rx="3" fill="#555"/>
  <text x="790" y="590" text-anchor="end" font-family="sans-serif" font-size="14" fill="#6b5e50">illustration placeholder</text>
</svg>
