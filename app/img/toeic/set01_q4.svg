<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A fruit vendor and a customer at an outdoor market">
  <rect width="800" height="600" fill="#cfe9f7"/>
  <circle cx="90" cy="80" r="45" fill="#ffd34d"/>
  <rect y="470" width="800" height="130" fill="#b7b0a3"/>
  <!-- awning stripes -->
  <g>
    <rect x="300" y="110" width="460" height="70" fill="#fff"/>
    <rect x="300" y="110" width="46" height="70" fill="#d9534f"/><rect x="392" y="110" width="46" height="70" fill="#d9534f"/>
    <rect x="484" y="110" width="46" height="70" fill="#d9534f"/><rect x="576" y="110" width="46" height="70" fill="#d9534f"/>
    <rect x="668" y="110" width="46" height="70" fill="#d9534f"/>
    <rect x="310" y="180" width="10" height="290" fill="#6b5e50"/><rect x="740" y="180" width="10" height="290" fill="#6b5e50"/>
  </g>
  <!-- vendor (right, behind stall) -->
  <rect x="560" y="270" width="100" height="150" rx="30" fill="#f2f2f2"/>
  <rect x="580" y="290" width="60" height="130" rx="10" fill="#3c8d4f"/>
  <circle cx="610" cy="238" r="36" fill="#d9a77f"/>
  <path d="M594 248 q16 14 32 0" stroke="#5a3a2a" stroke-width="4" fill="none"/>
  <!-- stall with boxes -->
  <rect x="330" y="380" width="410" height="100" fill="#9a6b3f"/>
  <rect x="350" y="350" width="170" height="50" fill="#c48a52"/>
  <rect x="545" y="350" width="170" height="50" fill="#c48a52"/>
  <g fill="#d7262e">
    <circle cx="375" cy="350" r="16"/><circle cx="410" cy="345" r="16"/><circle cx="445" cy="350" r="16"/><circle cx="480" cy="345" r="16"/><circle cx="505" cy="352" r="14"/>
  </g>
  <g fill="#f39a1e">
    <circle cx="570" cy="350" r="16"/><circle cx="605" cy="345" r="16"/><circle cx="640" cy="350" r="16"/><circle cx="675" cy="345" r="16"/><circle cx="700" cy="352" r="14"/>
  </g>
  <rect x="405" y="405" width="60" height="34" fill="#fff"/><text x="435" y="429" text-anchor="middle" font-family="sans-serif" font-size="18">€2</text>
  <rect x="600" y="405" width="60" height="34" fill="#fff"/><text x="630" y="429" text-anchor="middle" font-family="sans-serif" font-size="18">€3</text>
  <!-- customer (left) with shopping bag -->
  <rect x="150" y="300" width="95" height="170" rx="30" fill="#7b5ea7"/>
  <rect x="160" y="465" width="28" height="70" fill="#333"/><rect x="208" y="465" width="28" height="70" fill="#333"/>
  <circle cx="197" cy="265" r="36" fill="#f0c9a5"/>
  <path d="M160 270 q37 -80 74 0 l6 50 q-12 -60 -43 -66 q-31 6 -43 66z" fill="#6b3d22"/>
  <path d="M232 345 q20 0 24 30" stroke="#7b5ea7" stroke-width="16" fill="none" stroke-linecap="round"/>
  <rect x="232" y="370" width="60" height="70" rx="6" fill="#e8d3a8" stroke="#a88b5a" stroke-width="3"/>
  <path d="M244 372 q18 -26 36 0" stroke="#a88b5a" stroke-width="4" fill="none"/>
  <text x="790" y="590" text-anchor="end" font-family="sans-serif" font-size="14" fill="#6b5e50">illustration placeholder</text>
</svg>
