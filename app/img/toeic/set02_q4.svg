<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="People waiting at a bus stop on a rainy day as a bus approaches">
  <rect width="800" height="600" fill="#9fb0bd"/>
  <g stroke="#c9d6df" stroke-width="2" opacity=".7">
    <line x1="60" y1="20" x2="50" y2="60"/><line x1="200" y1="40" x2="190" y2="80"/><line x1="340" y1="15" x2="330" y2="55"/><line x1="480" y1="45" x2="470" y2="85"/><line x1="620" y1="20" x2="610" y2="60"/><line x1="740" y1="50" x2="730" y2="90"/>
    <line x1="120" y1="110" x2="110" y2="150"/><line x1="420" y1="120" x2="410" y2="160"/><line x1="700" y1="130" x2="690" y2="170"/>
  </g>
  <!-- trees -->
  <rect x="700" y="200" width="18" height="230" fill="#5d4029"/><circle cx="709" cy="190" r="60" fill="#4e7d4f"/>
  <!-- road + sidewalk -->
  <rect y="470" width="800" height="130" fill="#55595e"/>
  <rect y="440" width="800" height="34" fill="#a7a39b"/>
  <g fill="#e9e3d0"><rect x="40" y="530" width="80" height="8"/><rect x="200" y="530" width="80" height="8"/><rect x="360" y="530" width="80" height="8"/></g>
  <ellipse cx="560" cy="560" rx="90" ry="10" fill="#7d8790" opacity=".6"/>
  <!-- bus approaching on the left -->
  <rect x="10" y="300" width="250" height="165" rx="18" fill="#e0a43b"/>
  <rect x="25" y="320" width="60" height="60" fill="#cfe0ea"/><rect x="95" y="320" width="60" height="60" fill="#cfe0ea"/><rect x="165" y="320" width="60" height="60" fill="#cfe0ea"/>
  <rect x="236" y="320" width="18" height="90" fill="#cfe0ea"/>
  <rect x="20" y="300" width="230" height="14" fill="#333"/><text x="135" y="311" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffd34d">12</text>
  <circle cx="60" cy="468" r="24" fill="#222"/><circle cx="210" cy="468" r="24" fill="#222"/>
  <circle cx="252" cy="430" r="8" fill="#fff6c8"/>
  <!-- bus shelter -->
  <rect x="340" y="260" width="300" height="12" fill="#3d4650"/>
  <rect x="345" y="272" width="8" height="170" fill="#3d4650"/><rect x="627" y="272" width="8" height="170" fill="#3d4650"/>
  <rect x="560" y="280" width="60" height="120" fill="#e8eef2" stroke="#3d4650" stroke-width="3"/>
  <g stroke="#88939c" stroke-width="3"><line x1="570" y1="300" x2="610" y2="300"/><line x1="570" y1="315" x2="610" y2="315"/><line x1="570" y1="330" x2="600" y2="330"/><line x1="570" y1="345" x2="610" y2="345"/></g>
  <rect x="380" y="380" width="150" height="12" fill="#6b5e50"/>
  <!-- man under shelter, looking at phone -->
  <rect x="420" y="300" width="70" height="140" rx="22" fill="#2e3a59"/>
  <circle cx="455" cy="270" r="28" fill="#d9a77f"/>
  <path d="M428 266 q27 -36 54 0 q-4 -26 -27 -26 q-23 0 -27 26z" fill="#222"/>
  <rect x="470" y="318" width="16" height="26" rx="3" fill="#111"/>
  <rect x="428" y="438" width="20" height="40" fill="#222"/><rect x="462" y="438" width="20" height="40" fill="#222"/>
  <!-- woman with red umbrella outside shelter -->
  <path d="M640 280 a70 50 0 0 1 140 0z" fill="#d23b2f"/>
  <line x1="710" y1="280" x2="710" y2="360" stroke="#333" stroke-width="4"/>
  <rect x="680" y="320" width="64" height="130" rx="22" fill="#e0b84b"/>
  <circle cx="712" cy="300" r="26" fill="#f0c9a5"/>
  <path d="M686 300 q26 -40 52 0 l2 30 q-8 -34 -28 -38 q-20 4 -28 38z" fill="#6b3d22"/>
  <rect x="688" y="448" width="18" height="34" fill="#333"/><rect x="718" y="448" width="18" height="34" fill="#333"/>
  <text x="790" y="590" text-anchor="end" font-family="sans-serif" font-size="14" fill="#e9e3d0">illustration placeholder</text>
</svg>
